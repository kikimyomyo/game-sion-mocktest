                  {step.book_diagram_source && <div style={{marginTop:6, fontSize:"0.78em", color:"#999"}}>{step.book_diagram_source}</div>}
                </div>
              )}
              {step.video_url && !step.book_diagram_url && (
                <div style={{margin:"16px 0", textAlign:"center"}}>
                  <video src={step.video_url} autoPlay loop muted playsInline controls style={{maxWidth:"100%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.15)"}} />
                </div>
              )}
              {step.image_url && !step.video_url && !step.book_diagram_url && (
                <div style={{margin:"16px 0", textAlign:"center"}}>
                  <img src={step.image_url} alt="개념 도식" style={{maxWidth:"100%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.15)"}} />
                </div>
              )}
              <WidgetBox key={"wb1-" + stepIdx} widget={matchWidget(step)} />
              <p style={{marginTop:14, color:"#888", fontSize:"0.9em"}}>다음 ▶ 누르면 시온이 수준 문제로 먼저 도전! 맞히면 사다리는 건너뛰어 😎</p>
            </>
          )}

          {/* 📖 P6 지문 — 책 발췌를 화면에서 직접 읽고 문제로 */}
          {step.type === "passage" && (
            <>
              <div className="step-title">📖 이번 주 책 — 「{step.book}」</div>
              {step.range && <div style={{marginBottom:8}}><span className="badge">{step.range}</span></div>}
              {step.intro && (
                <div style={{fontSize:"0.92em", color:"#9c6b00", background:"#fff8e1",
                  padding:"9px 13px", borderRadius:10, marginBottom:12, fontWeight:700}}>
                  💡 {step.intro}
                </div>
              )}
              <div style={{
                background:"#fffdf7", border:"2px solid #e8dcc0", borderRadius:16,
                padding:"18px 16px", maxHeight:"58vh", overflowY:"auto",
                fontSize:"1.04em", lineHeight:1.95, whiteSpace:"pre-wrap",
                fontFamily:"'Nanum Gothic', sans-serif", color:"#33302a",
              }}>{step.passage}</div>
              <p style={{marginTop:12, color:"#888", fontSize:"0.88em", textAlign:"center"}}>
                천천히 읽고 — 다 읽으면 다음 ▶ (문제 3개가 기다려!)
              </p>
            </>
          )}

          {/* 🏆 P1 피날레 — 사이클 클리어, 수능 앵커를 보상 위치로 */}
          {step.type === "finale" && (
            <div style={{textAlign:"center", padding:"20px 6px"}}>
              <div style={{fontSize:"3em", marginBottom:8}}>🏆</div>
              <div className="step-title" style={{marginBottom:6}}>사이클 클리어!</div>
              <div style={{fontSize:"1.05em", lineHeight:1.7, color:"#3a2a6b", fontWeight:700}}>
                방금 {step.suneung ? `[${step.suneung}]` : "수능"} 유형 하나를 정복했어!
              </div>
              {step.통합풀이법 && (
                <div style={{margin:"14px auto 0", maxWidth:480, padding:"12px 16px",
                  background:"#fffaf0", border:"2px solid #ffd89c", borderRadius:14,
                  fontSize:"0.95em", color:"#9c6b00", fontWeight:700}}>
                  💡 가져가는 무기: "{step.통합풀이법}"
                </div>
              )}
              <p style={{marginTop:14, color:"#888", fontSize:"0.88em"}}>
                {step.unit ? `「${step.unit}」 — ` : ""}이 풀이법은 이제 네 거야.
              </p>
            </div>
          )}

          {/* 💬 P9 자기설명 — 오늘 배운 것 하나를 아빠에게 한 줄로 (효과크기 최상위 기법) */}
          {step.type === "explain" && (
            <div style={{padding:"8px 2px"}}>
              <div className="step-title">💬 마지막 한 가지 — 아빠에게 설명하기</div>
              <p style={{fontSize:"0.95em", color:"#555", lineHeight:1.7, marginBottom:12}}>
                오늘 푼 것 중 <b>하나</b>를 골라서, 아빠에게 한 줄로 설명해줘.<br/>
                <span style={{color:"#999", fontSize:"0.88em"}}>
                  (남에게 설명할 수 있으면 진짜 아는 거야 — 과학자들이 제일 강력하다고 한 공부법!)
                </span>
              </p>
              <textarea
                value={shortText}
                onChange={e => setShortText(e.target.value)}
                placeholder="예: 독립사건은 동전이랑 주사위처럼 서로 영향 없는 거라서 확률을 곱하면 돼!"
                rows={3}
                style={{width:"100%", borderRadius:12, border:"2px solid #e8d5ff",
                        padding:"10px 12px", fontSize:"0.95em", fontFamily:"inherit", resize:"none"}}
              />
              <div style={{display:"flex", gap:10, marginTop:12, justifyContent:"flex-end"}}>
                <button className="btn btn-ghost" onClick={() => finishGame()}>건너뛰고 결과 보기</button>
                <button className="btn" disabled={!shortText.trim()} onClick={() => {
                  try {
                    const ep = cfg.endpoint;
                    const payload = {
                      game: "sion-messages", sheet_tab: "sion-messages",
                      timestamp: new Date().toISOString(),
                      player: "시온", answers: [{ text: "📣 오늘 배운 것: " + shortText.trim() }],
                    };
                    if (IS_LOCAL_PREVIEW) console.log("[local preview] explain skip");
                    else if (window.GameRecorder?.send) window.GameRecorder.send(payload);
                    else if (ep) fetch(ep, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
                  } catch (e) {}
                  playSfx("ok");
                  finishGame();
                }}>아빠에게 보내고 결과 보기 💌</button>
              </div>
            </div>
          )}

          {step.type === "integrated" && (
            <>
              <div style={{display:"inline-block", background:"#fff0e0", color:"#c87800", padding:"4px 12px", borderRadius:14, fontSize:"0.92em", fontWeight:700, marginBottom:8}}>
                💡 통합 풀이법 ⭐
              </div>
              <div className="step-title">{step.title || "💡 통합 풀이법"}</div>
              <div className="step-body" style={{background:"#fffaf0", padding:14, borderRadius:14, border:"2px solid #ffd89c", whiteSpace:"pre-wrap"}}>{step.body}</div>
              <p style={{marginTop:14, color:"#888", fontSize:"0.9em"}}>위 한 줄 기억법으로 같은 유형 다 풀 수 있어!</p>
            </>
          )}

          {step.type === "concept" && (
            <>
              <span className={`level-tag ${step.level}`}>🪜 {step.level}</span>
              <div className="step-title">{step.title || `${step.level} 개념`}</div>
              <div style={{
                fontSize: "1.05em",
                lineHeight: 1.85,
                whiteSpace: "pre-wrap",
                background: step.level === "초등" ? "#fff5f7" : step.level === "중등" ? "#f5f0ff" : "#eef5ff",
                padding: 16,
                borderRadius: 14,
                border: `2px solid ${step.level === "초등" ? "#ffb6c1" : step.level === "중등" ? "#c4a8ff" : "#86b3ff"}`,
                marginTop: 8,
              }}>{step.body}</div>
              <p style={{marginTop:10, color:"#888", fontSize:"0.85em"}}>
                {step.level === "초등" && "💡 시온이가 이미 아는 것 — 천천히 읽어봐"}
                {step.level === "중등" && "💡 곧 배울 것 — 초등에 이름표만 붙인 거야"}
                {step.level === "고등" && "💡 먼 미래에 만날 것 — 지금 외울 필요 없어, 그저 보기만"}
              </p>
            </>
          )}

          {step.type === "solution" && (
            <>
              <div className="step-title">{step.title || "✏️ 풀이 해설"}</div>
              {/* Phase 10: 메타인지 카드 — 해설 시작 전에 모듈·개념·주제 명시 */}
              <div style={{
                marginBottom:14, padding:"12px 14px", borderRadius:14,
                background:"linear-gradient(135deg, #f0e8ff 0%, #fff0f7 100%)",
                border:"2px solid #c4a8ff",
              }}>
                <div style={{fontSize:"0.75em", fontWeight:800, color:"#6b4ba8", marginBottom:8}}>
                  🎯 지금 배우는 것 (메타인지)
                </div>
                <div style={{fontSize:"0.85em", lineHeight:1.7, color:"#3a2a6b"}}>
                  <div>📚 <b>영역</b>: {step.subject || "-"}</div>
                  <div>🎯 <b>모듈 (단원)</b>: {step.unit || "이번 단원"}</div>
                  {step.suneung && (
                    <div>📌 <b>참고 기출</b>: {step.suneung}</div>
                  )}
                  <div style={{marginTop:6, fontSize:"0.85em", color:"#6b4ba8", fontStyle:"italic"}}>
                    → "어떤 단원의 어떤 풀이법인지 의식하면, 다음에 같은 유형 보자마자 떠올라."
                  </div>
                </div>
              </div>
              {/* 본문 재표시 + 발문 핵심 키워드 강조 */}
              {step.realBody && (
                <details open style={{marginBottom:14, background:"#faf6ff", padding:12, borderRadius:12, border:"1px dashed #b48dff"}}>
                  <summary style={{cursor:"pointer", fontWeight:700, color:"#6b4ba8", fontSize:"0.9em"}}>📄 진짜 수능 본문 다시 보기 (정답 근거 노란 강조)</summary>
                  <div style={{marginTop:8, fontSize:"0.92em", lineHeight:1.7, whiteSpace:"pre-wrap"}}>{renderWithEmphasis(step.realBody, step.emphasize)}</div>
                </details>
              )}
              {/* 정답 시각 강조: ①~⑤ 카드 + 정답에 초록 배경+체크 */}
              {step.realChoices && step.realChoices.length >= 4 && step.realAnswer && (
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:"0.88em", color:"#888", marginBottom:6}}>선택지 (정답 강조)</div>
                  {step.realChoices.map((c, i) => {
                    const num = ["①","②","③","④","⑤"][i] || `${i+1}`;
                    const isAnswer = (step.realAnswer || "").includes(num);
                    return (
                      <div key={i} style={{
                        padding:"7px 11px", marginBottom:5, borderRadius:9,
                        background: isAnswer ? "#d4f5d4" : "#f8f5ff",
                        border: isAnswer ? "2px solid #4caf50" : "1px solid #e8d5ff",
                        fontWeight: isAnswer ? 700 : 400,
                        fontSize:"0.92em",
                      }}>
                        <span style={{color: isAnswer ? "#2a7a2a" : "#6b4ba8", marginRight:8}}>{isAnswer ? "✅ " : ""}{num}</span>
                        {c}
                      </div>
                    );
                  })}
                </div>
              )}
              {/* 단계묶음 체크리스트 (있으면 위에 시각화) */}
              {step.steps && step.steps.length > 0 && (
                <div style={{marginBottom:14, padding:12, background:"#fffaf0", borderRadius:12, border:"1px solid #ffd89c"}}>
                  <div style={{fontSize:"0.88em", color:"#c87800", fontWeight:700, marginBottom:6}}>🪜 단계 따라 풀이</div>
                  {step.steps.map((s, i) => (
                    <div key={i} style={{padding:"4px 0", fontSize:"0.92em"}}>
                      <span style={{color:"#c87800", fontWeight:700, marginRight:6}}>{i+1}.</span>{s}
                    </div>
                  ))}
                </div>
              )}
              {step.book_diagram_url && (
                <div style={{margin:"10px 0", textAlign:"center"}}>
                  <img src={step.book_diagram_url} alt="책 도해" style={{maxWidth:"80%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.12)"}} />
                  {step.book_diagram_source && <div style={{marginTop:6, fontSize:"0.78em", color:"#999"}}>{step.book_diagram_source}</div>}
                </div>
              )}
              {step.video_url && !step.book_diagram_url && (
                <div style={{margin:"10px 0", textAlign:"center"}}>
                  <video src={step.video_url} autoPlay loop muted playsInline controls style={{maxWidth:"90%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.12)"}} />
                </div>
              )}
              {step.image_url && !step.video_url && !step.book_diagram_url && (
                <div style={{margin:"10px 0", textAlign:"center"}}>
                  <img src={step.image_url} alt="풀이 도식" style={{maxWidth:"80%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.12)"}} />
                </div>
              )}
              <WidgetBox key={"wb2-" + stepIdx} widget={matchWidget(step)} />
              <div className="step-body" style={{padding:12, background:"#e8f7e8", borderRadius:12, border:"2px solid #4caf50"}}>
                <strong style={{color:"#2a7a2a"}}>📝 핵심 풀이:</strong>
                <div style={{marginTop:6, whiteSpace:"pre-wrap"}}>{step.body}</div>
              </div>
            </>
          )}

          {step.type === "quiz" && (
            <>
              <div className="step-title">{step.title || "🎲 변형 문제"}</div>
              {/* 📖 책 문제 — 지문 다시 보기 (접이식) */}
              {step.passage && (
                <details style={{marginBottom:12, background:"#fffdf7", border:"1px dashed #d4c5a0",
                  borderRadius:12, padding:"10px 13px"}}>
                  <summary style={{cursor:"pointer", fontWeight:700, color:"#9c6b00", fontSize:"0.9em"}}>
                    📖 지문 다시 보기
                  </summary>
                  <div style={{marginTop:8, maxHeight:"40vh", overflowY:"auto",
                    fontSize:"0.95em", lineHeight:1.85, whiteSpace:"pre-wrap", color:"#33302a"}}>
                    {step.passage}
                  </div>
                </details>
              )}
              <div className="quiz-box">
                <div className="step-body" style={{marginBottom:14, fontWeight:700}}>{step.data.question}</div>
                {step.data.type === "mcq" ? (
                  <div className="choices">
                    {(step.data.choices || []).map((c, i) => {
                      const correctAns = resolveAnswer(step.data);
                      let cls = "choice";
                      if (showFeedback) {
                        if (c === correctAns) cls += " correct";
                        else if (c === picked) cls += " wrong";
                      }
                      return <button key={i} className={cls} disabled={showFeedback} onClick={() => setPicked(c)} style={picked === c && !showFeedback ? {borderColor:"#b48dff", background:"#f6f0ff"} : {}}>{c}</button>;
                    })}
                  </div>
                ) : (
                  <input className="short-input" value={shortText} onChange={e => setShortText(e.target.value)} placeholder="답을 입력하세요" disabled={showFeedback} onKeyDown={e => e.key === "Enter" && submitQuiz()} autoFocus />
                )}
                {showFeedback && (
                  <>
                    {/* Phase 10: 메타인지 카드 — 정답 후 '방금 배운 것' 명시 (모듈·개념·주제) */}
                    <div style={{
                      marginTop:12, padding:"12px 14px", borderRadius:14,
                      background:"linear-gradient(135deg, #f0e8ff 0%, #fff0f7 100%)",
                      border:"2px solid #c4a8ff",
                    }}>
                      <div style={{fontSize:"0.75em", fontWeight:800, color:"#6b4ba8", marginBottom:8}}>
                        ✨ 방금 배운 것 (메타인지)
                      </div>
                      <div style={{fontSize:"0.85em", lineHeight:1.7, color:"#3a2a6b"}}>
                        <div>📚 <b>영역</b>: {step.subject || step.data.subject || "-"}</div>
                        <div>🎯 <b>모듈 (단원)</b>: {step.unit || step.data.unit || "이번 단원"}</div>
                        {step.data.hint && (
                          <div>💡 <b>핵심 개념·풀이법</b>: {step.data.hint}</div>
                        )}
                        <div style={{marginTop:6, fontSize:"0.85em", color:"#6b4ba8", fontStyle:"italic"}}>
                          → "지금 무엇을 배웠는지 알아두면, 비슷한 문제 나올 때 바로 떠올라."
                        </div>
                      </div>
                    </div>
                    <div className={"feedback " + (answers[answers.length-1]?.correct ? "ok" : "")}>
                      <strong>{answers[answers.length-1]?.correct ? "✅ 정답!" : `❌ 정답: ${answers[answers.length-1]?.correctAns ?? resolveAnswer(step.data)}`}</strong>
                      {step.data.explanation && <div style={{marginTop:6}}>{step.data.explanation}</div>}
                    </div>
                    <WidgetBox key={"wb3-" + stepIdx} widget={matchWidget(step)} />
                  </>
                )}
              </div>
            </>
          )}

          {step.type !== "explain" && (
          <div className="actions">
            {/* Phase 4: 첫 챌린지 step일 때 "패스 →" 버튼 추가 (이 사이클 챌린지 모두 스킵) */}
            {step.type === "quiz" && step.is_challenge && isFirstChallengeInCycle && !showFeedback && (
              <button
                className="btn"
                onClick={skipChallenges}
                style={{background:"#e0d8ec", color:"#6b4ba8", marginRight:8}}
              >
                ⏭ 다음으로
              </button>
            )}
            {step.type === "quiz" && !showFeedback ? (
              <button className="btn" onClick={submitQuiz} disabled={step.data.type === "mcq" ? picked === null : !shortText.trim()} style={{marginLeft:"auto"}}>
                {step.data.is_revenge ? "복수 +15 ⚔️" : step.is_challenge ? "도전 +5 ⚡" : "제출"}
              </button>
            ) : (
              <button className="btn" onClick={goNext} style={{marginLeft:"auto"}}>{isLastStep ? "결과 보기 🎉" : "다음 ▶"}</button>
            )}
          </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
