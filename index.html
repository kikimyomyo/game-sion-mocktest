<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시온이 학습</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="./config.js"></script>
  <script src="./recorder.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: 'Nanum Gothic', sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe5f0 0%, #e8d5ff 50%, #d5e6ff 100%);
      min-height: 100vh; padding: 16px; color: #2a2a3a; line-height: 1.6;
    }
    .root { max-width: 760px; margin: 0 auto; }
    .card { background: rgba(255,255,255,0.94); border-radius: 24px; padding: 26px; box-shadow: 0 12px 36px rgba(120,80,200,0.18); margin-bottom: 14px; }
    .title { font-family: 'Gaegu', cursive; font-size: 1.8em; font-weight: 700; color: #6b4ba8; text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #888; font-size: 0.93em; margin-bottom: 14px; }
    .progress { background: #f0e8ff; height: 8px; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar { background: linear-gradient(90deg, #ff8fc5, #b48dff); height: 100%; transition: width 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes trophy-shine {
      0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
      50% { box-shadow: 0 4px 14px rgba(255,193,7,0.4); }
    }
    @keyframes xp-popup {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { transform: translateY(-30px) scale(1.2); opacity: 1; }
      80% { transform: translateY(-80px) scale(1); opacity: 1; }
      100% { transform: translateY(-120px) scale(0.9); opacity: 0; }
    }
    .xp-toast {
      position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #ffd700 0%, #ffaa3a 100%);
      color: #4a2d00; padding: 16px 28px; border-radius: 16px;
      font-size: 1.6em; font-weight: 900;
      box-shadow: 0 8px 24px rgba(255,170,58,0.5);
      z-index: 9999; pointer-events: none;
      animation: xp-popup 2s ease-out forwards;
    }
    .step-meta { color: #888; font-size: 0.85em; margin-bottom: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .badge { display: inline-block; background: #f0e8ff; color: #6b4ba8; border-radius: 14px; padding: 3px 10px; font-size: 0.82em; }
    .badge.suneung { background: #fff0e0; color: #c87800; font-weight: 700; }
    .step-title { font-family: 'Gaegu', cursive; font-size: 1.6em; color: #6b4ba8; margin-bottom: 10px; }
    .step-body { font-size: 1.05em; line-height: 1.75; white-space: pre-wrap; }
    .step-body p { margin-bottom: 8px; }
    .level-tag { display: inline-block; background: #b48dff; color: white; border-radius: 10px; padding: 4px 12px; font-size: 0.92em; font-weight: 700; margin-bottom: 8px; }
    .level-tag.초등 { background: #ff8fc5; }
    .level-tag.중등 { background: #b48dff; }
    .level-tag.고등 { background: #4d9eff; }
    .quiz-box { background: #faf6ff; border-radius: 16px; padding: 18px; margin-top: 10px; }
    .choices { display: grid; gap: 10px; margin: 14px 0; }
    .choice { background: white; border: 2px solid #e8d5ff; border-radius: 14px; padding: 13px 16px; text-align: left; cursor: pointer; font-size: 1em; transition: all 0.15s; font-family: inherit; }
    .choice:hover:not(:disabled) { border-color: #b48dff; transform: translateY(-1px); }
    .choice.correct { background: #d4f5d4; border-color: #4caf50; }
    .choice.wrong { background: #ffd4d4; border-color: #f44336; }
    .choice:disabled { cursor: default; }
    .short-input { width: 100%; padding: 13px; border: 2px solid #e8d5ff; border-radius: 14px; font-size: 1em; font-family: inherit; }
    .short-input:focus { outline: none; border-color: #b48dff; }
    .feedback { background: #fff8e1; border-left: 4px solid #ffb84d; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 0.95em; }
    .feedback.ok { background: #e8f7e8; border-left-color: #4caf50; }
    .actions { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .btn { background: linear-gradient(135deg, #ff8fc5, #b48dff); color: white; border: none; border-radius: 14px; padding: 12px 24px; font-size: 1em; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: white; color: #6b4ba8; border: 2px solid #b48dff; }
    .empty { text-align: center; padding: 40px 20px; color: #888; }
    .empty-emoji { font-size: 3em; margin-bottom: 10px; }
    .result-score { font-family: 'Gaegu', cursive; font-size: 3.5em; color: #6b4ba8; font-weight: 700; text-align: center; }
    .focus-tag { display: inline-block; background: #f0e8ff; color: #6b4ba8; border-radius: 18px; padding: 3px 12px; font-size: 0.85em; margin: 3px; }
    @media (max-width: 480px) {
      .card { padding: 18px; }
      .title { font-size: 1.5em; }
      .step-title { font-size: 1.4em; }
    }
  </style>
</head>
<body>
  <div class="root" id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function speak(text) {
      try {
        if (!("speechSynthesis" in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = /[ㄱ-힝]/.test(text) ? "ko-KR" : "en-US";
        u.rate = 0.92;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }
    function playSfx(t) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        if (t === "ok") { osc.frequency.value = 660; osc.type = "triangle"; g.gain.value = 0.18; }
        else if (t === "wrong") { osc.frequency.value = 220; osc.type = "sawtooth"; g.gain.value = 0.12; }
        else { osc.frequency.value = 440; osc.type = "sine"; g.gain.value = 0.1; }
        osc.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.stop(ctx.currentTime + 0.32);
      } catch (e) {}
    }
    // 로컬 프리뷰(개발 검증)에서는 실제 시트로 전송 금지 — 시온이 기록 오염 방지 (2026-06-10 사고 후 도입)
    const IS_LOCAL_PREVIEW = ["localhost", "127.0.0.1", ""].includes(location.hostname);
    function recordResult(payload) {
      try {
        if (IS_LOCAL_PREVIEW) { console.log("[local preview] record skip:", payload.score + "/" + payload.total); return; }
        if (window.GameRecorder?.send) return window.GameRecorder.send(payload);
        const cfg = window.GAME_CONFIG;
        if (!cfg.endpoint || cfg.endpoint.includes("PLACEHOLDER")) return;
        fetch(cfg.endpoint, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) }).catch(() => {});
      } catch (e) {}
    }

    // 각 사이클을 6 step으로 펼침 (학습 슬라이드)
    // 본문 강조구간을 React 요소 배열로 변환 (노란 mark 하이라이트)
    function renderWithEmphasis(text, emphasize) {
      if (!text || !Array.isArray(emphasize) || emphasize.length === 0) return text;
      // emphasize substring 중 본문에 실제 존재하는 것만 사용 (긴 순서)
      const valid = emphasize.filter(e => typeof e === "string" && e.length >= 3 && text.includes(e))
                              .sort((a, b) => b.length - a.length);
      if (valid.length === 0) return text;
      const parts = [{t: text, mark: false}];
      for (const v of valid) {
        for (let i = 0; i < parts.length; i++) {
          if (parts[i].mark) continue;
          const idx = parts[i].t.indexOf(v);
          if (idx < 0) continue;
          const before = parts[i].t.slice(0, idx);
          const after = parts[i].t.slice(idx + v.length);
          const inserts = [];
          if (before) inserts.push({t: before, mark: false});
          inserts.push({t: v, mark: true});
          if (after) inserts.push({t: after, mark: false});
          parts.splice(i, 1, ...inserts);
          i += inserts.length - 1;
        }
      }
      return parts.map((p, i) => p.mark
        ? React.createElement("mark", {key: i, style: {background: "#fff59d", padding: "1px 3px", borderRadius: 3, fontWeight: 600}}, p.t)
        : React.createElement(React.Fragment, {key: i}, p.t));
    }

    // ★ P1 풀이-먼저 전환 (2026-06-10 학습방식 재검토):
    //   순서 = 🔮 선시도(찍어봐, 무부담) → 🎲 변형1 먼저 도전 → (틀렸을 때만) 🪜 사다리·✏️ 해설
    //          → 💡 풀이법(항상) → 🎲 변형2 재검증 → ⚡ 챌린지 → 🏆 피날레
    //   사다리·해설은 gated — 변형1을 맞히면 자동 건너뜀 ("필요한 순간의 설명"이 흡수율이 높다).
    function expandCycleToSteps(p) {
      if (!p.기출유사문제 && !p.진짜수능본문 && !p.개념사다리 && !p.필요한_개념 && !p.풀이해설) {
        return [{ type: "quiz", data: p }];
      }
      const steps = [];
      const variants = Array.isArray(p.변형문제_세트) ? p.변형문제_세트
                     : p.변형문제 ? [p.변형문제] : [];
      // 1) 진짜 수능 문제 + 🔮 찍어보기 (pretesting — 맞아도 틀려도 점수 무관)
      if (p.진짜수능본문 || p.기출유사문제 || p.수능출처) {
        const realBody = p.진짜수능본문 || p.기출유사문제 || "";
        const realChoices = p.진짜수능선택지 || null;
        const realAnswer = p.진짜수능정답 || null;
        const emphasize = Array.isArray(p.강조구간) ? p.강조구간 : null;
        steps.push({
          type: "intro",
          title: p.진짜수능본문 ? "🎯 진짜 수능 문제 — 일단 찍어봐!" : "🎯 수능 기출 유사 문제 — 일단 찍어봐!",
          body: realBody,
          suneung: p.수능출처 || "",
          unit: p.unit,
          realChoices, realAnswer, emphasize,
          predict: !!(realChoices && realChoices.length >= 4 && realAnswer),
        });
      }
      // 2) 🎲 변형 1 — 설명 없이 먼저 도전 (생산적 실패 OK)
      if (variants[0]) {
        steps.push({
          type: "quiz",
          title: "🎲 먼저 풀어보기 — 일단 도전! (틀려도 사다리가 기다려)",
          data: { ...variants[0], id: `${p.id}-v1`, unit: p.unit, subject: p.subject },
          is_variant1: true,
        });
      }
      // 3) 🪜 사다리 — gated: 변형1 정답이면 자동 건너뜀
      const needed = p.필요한_개념 || {};
      const sadari = p.개념사다리 || {};
      ["초등","중등","고등"].forEach(level => {
        const raw = needed[level] || sadari[level];
        if (!raw) return;
        // v3.6: nested 4구조 object 우선, flat string fallback
        let body;
        if (typeof raw === "object" && raw !== null) {
          const parts = [];
          if (raw.개념풀이) parts.push(`① 개념 풀이\n${raw.개념풀이}`);
          if (raw.풀이예시) parts.push(`② 풀이 예시\n${raw.풀이예시}`);
          if (raw.다음단계다리) parts.push(`③ 다음 단계 다리\n${raw.다음단계다리}`);
          if (raw.문제적용) parts.push(`④ 이 수능 문제에 적용\n${raw.문제적용}`);
          body = parts.join("\n\n");
        } else {
          body = raw;
        }
        steps.push({
          type: "concept",
          level,
          body,
          gated: true,
          title: needed[level] ? `🪜 ${level} 개념 — 이 문제에 필요` : `🪜 ${level}`,
        });
      });
      // 4) 💡 통합 풀이법 — 항상 표시 (맞혔어도 요약 한 장으로 다지기)
      if (p.통합풀이법 || p.단계묶음 || p.비유) {
        const bodyParts = [];
        if (p.통합풀이법) bodyParts.push(`기억법: ${p.통합풀이법}`);
        if (Array.isArray(p.단계묶음) && p.단계묶음.length) {
          bodyParts.push(`\n단계:\n` + p.단계묶음.map((s,i) => `${i+1}. ${s}`).join("\n"));
        }
        if (p.비유) bodyParts.push(`\n비유: ${p.비유}`);
        steps.push({ type: "integrated", title: "💡 통합 풀이법 (외우기 쉬운 한 줄)", body: bodyParts.join("\n") });
      }
      // 5) ✏️ 풀이 해설 — gated (틀렸을 때만)
      if (p.풀이해설) steps.push({
        type: "solution",
        gated: true,
        title: "✏️ 풀이 해설",
        body: p.풀이해설,
        realBody: p.진짜수능본문 || p.기출유사문제 || "",
        realChoices: p.진짜수능선택지 || null,
        realAnswer: p.진짜수능정답 || null,
        steps: Array.isArray(p.단계묶음) ? p.단계묶음 : null,
        emphasize: Array.isArray(p.강조구간) ? p.강조구간 : null,
      });
      // 6) 🎲 변형 2+ — 풀이법 장착 후 재검증
      variants.slice(1).forEach((v, vi) => {
        steps.push({
          type: "quiz",
          title: `🎲 다시 도전 ${vi+2}/${variants.length} — 풀이법 장착 완료!`,
          data: { ...v, id: `${p.id}-v${vi+2}`, unit: p.unit, subject: p.subject },
        });
      });
      // 7) ⚡ 챌린지 (선택 — "한 판 더!" 옵션). 풀이 시 +5 XP 보너스.
      const challenges = Array.isArray(p.챌린지_추가) ? p.챌린지_추가 : [];
      challenges.forEach((c, ci) => {
        steps.push({
          type: "quiz",
          title: `⚡ 챌린지 ${ci+1}/${challenges.length} — 한 판 더! (+5 보너스 XP)`,
          data: { ...c, id: `${p.id}-c${ci+1}`, unit: p.unit, subject: p.subject, is_challenge: true },
          is_challenge: true,
        });
      });
      // 8) 🏆 피날레 — 수능 앵커를 보상 위치로 (유능감 마무리)
      steps.push({
        type: "finale",
        suneung: p.수능출처 || "",
        unit: p.unit,
        통합풀이법: p.통합풀이법 || "",
      });
      return steps;
    }

    // 🧪 조작형 위젯 embed — diagrams/widgets.json 레지스트리 기반 (2026-06-10 농도실험실 첫 사례)
    function WidgetBox({ widget }) {
      const [open, setOpen] = useState(false);
      if (!widget) return null;
      return (
        <div style={{margin:"14px 0", textAlign:"center"}}>
          {!open ? (
            <button onClick={() => setOpen(true)} style={{
              background:"linear-gradient(90deg, #ff8fc5, #b48dff)", color:"white", border:"none",
              borderRadius:16, padding:"13px 22px", fontSize:"1.0em", fontWeight:800,
              cursor:"pointer", boxShadow:"0 6px 16px rgba(180,141,255,0.35)", fontFamily:"inherit",
            }}>🧪 {widget.title} — 직접 움직여봐!</button>
          ) : (
            <div>
              <iframe src={"./diagrams/" + widget.file} title={widget.title}
                style={{width:"100%", height:580, border:"none", borderRadius:14, background:"white",
                  boxShadow:"0 4px 12px rgba(120,80,200,0.15)"}} />
              <div style={{marginTop:2}}>
                <a href={"./diagrams/" + widget.file} target="_blank" rel="noreferrer"
                  style={{fontSize:"0.82em", color:"#888"}}>↗ 전체 화면으로 크게 열기</a>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const cfg = window.GAME_CONFIG || {};
      const defaultProblems = cfg.problems || [];
      const defaultMeta = cfg.meta || {};
      const [selectedProblems, setSelectedProblems] = useState(defaultProblems);
      const [selectedMeta, setSelectedMeta] = useState(defaultMeta);
      const [selectedDate, setSelectedDate] = useState(defaultMeta.generated_at || "");
      const [hubMode, setHubMode] = useState(true);
      const [archiveIndex, setArchiveIndex] = useState(null);
      const [solveStats, setSolveStats] = useState(null);  // 시트에서 가져온 풀이 결과 {byDate, totals}

      // 허브: archive/index.json 가져오기
      useEffect(() => {
        fetch(`./archive/index.json?v=${Date.now()}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => setArchiveIndex(d))
          .catch(() => setArchiveIndex(null));
      }, []);

      // 허브: 시온이 풀이 결과 (Apps Script doGet sion-mocktest 시트)
      useEffect(() => {
        const ep = cfg.endpoint;
        if (!ep || ep.includes("PLACEHOLDER")) return;
        fetch(`${ep}?action=get&tab=sion-mocktest&v=${Date.now()}`)
          .then(r => r.ok ? r.json() : null)
          .then(j => {
            if (!j || !j.ok || !Array.isArray(j.rows)) return;
            const rows = j.rows.slice(1);  // skip header
            const byDate = {};
            let totalSolved = 0, totalCorrect = 0, perfectCount = 0;
            for (const r of rows) {
              try {
                const ts = r[0];
                const score = parseInt(r[2], 10);
                const total = parseInt(r[3], 10);
                const dur = parseInt(r[4], 10);
                if (!ts || !Number.isFinite(score) || !Number.isFinite(total) || total === 0) continue;
                // 시온이 본인 풀이만 (장난 풀이 score/total < 50% & duration < 60초 = 무작위 입력 의심 제외)
                if (score / total < 0.5 && dur < 60 && total > 5) continue;
                const date = ts.slice(0, 10);
                if (!byDate[date]) byDate[date] = [];
                byDate[date].push({ score, total, dur });
                totalSolved += total;
                totalCorrect += score;
                if (score === total) perfectCount++;
              } catch (e) {}
            }
            // 연속일 계산 (오늘부터 거꾸로)
            let streak = 0;
            const today = new Date();
            for (let i = 0; i < 60; i++) {
              const d = new Date(today); d.setDate(today.getDate() - i);
              const ds = d.toISOString().slice(0, 10);
              if (byDate[ds]) streak++;
              else if (i > 0) break;  // 오늘은 안 풀어도 OK, 어제부터 끊김 체크
            }
            setSolveStats({
              byDate,
              totals: {
                days: Object.keys(byDate).length,
                attempts: rows.length,
                solved: totalSolved,
                correct: totalCorrect,
                rate: totalSolved ? (totalCorrect / totalSolved) : 0,
                perfect: perfectCount,
                streak,
              },
            });
          })
          .catch(() => {});
      }, []);

      // 💌 소통 — 시온이↔아빠 메시지 (sion-messages 탭)
      const [messages, setMessages] = useState([]);
      const [myMsg, setMyMsg] = useState("");
      const [msgSent, setMsgSent] = useState(false);
      const loadMessages = React.useCallback(() => {
        const ep = cfg.endpoint;
        if (!ep || ep.includes("PLACEHOLDER")) return;
        fetch(`${ep}?action=get&tab=sion-messages&v=${Date.now()}`)
          .then(r => r.ok ? r.json() : null)
          .then(j => {
            if (!j || !j.ok || !Array.isArray(j.rows)) return;
            // row: [timestamp, player, score, total, duration, answers_json, meta_json, game]
            // 메시지는 answers_json[0]에 텍스트, player=시온/아빠
            const msgs = j.rows.slice(1).map(r => {
              let text = "";
              try { const a = JSON.parse(r[5] || "[]"); text = Array.isArray(a) ? (a[0]?.text || a[0] || "") : ""; } catch(e) {}
              return { ts: r[0], who: r[1], text: String(text) };
            }).filter(m => m.text);
            setMessages(msgs.slice(-8));  // 최근 8개
          })
          .catch(() => {});
      }, []);
      useEffect(() => { loadMessages(); }, [loadMessages]);

      // 🏅 주간 승리 리캡 (weekly_review.py가 생성 — P3, 승리 중심 피드백)
      const [weeklyRecap, setWeeklyRecap] = useState(null);
      useEffect(() => {
        fetch(`./weekly_recap.json?v=${Date.now()}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (!d || !d.week_of) return;
            const age = (Date.now() - new Date(d.week_of).getTime()) / 86400000;
            if (age <= 8) setWeeklyRecap(d);
          })
          .catch(() => {});
      }, []);

      function sendMyMessage() {
        const t = myMsg.trim();
        if (!t) return;
        const ep = cfg.endpoint;
        if (!ep) return;
        const payload = {
          game: "sion-messages", sheet_tab: "sion-messages",
          timestamp: new Date().toISOString(),
          player: "시온", answers: [{ text: t }],
        };
        try {
          if (IS_LOCAL_PREVIEW) { console.log("[local preview] message skip"); }
          else if (window.GameRecorder?.send) window.GameRecorder.send(payload);
          else fetch(ep, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
          setMsgSent(true);
          setMyMsg("");
          setTimeout(() => { loadMessages(); }, 1500);
        } catch (e) {}
      }

      function loadDay(date) {
        fetch(`./archive/${date}.json?v=${Date.now()}`)
          .then(r => r.json())
          .then(d => {
            setSelectedProblems(d.problems || []);
            setSelectedMeta(d.meta || {});
            setSelectedDate(date);
            setHubMode(false);
          })
          .catch(e => alert("그날 자료 못 불러옴: " + e));
      }

      function backToHub() {
        setHubMode(true);
        setSelectedDate("");
      }

      const problems = selectedProblems;
      const meta = selectedMeta;

      // ★ P1 (2026-06-10): 변형1 정답 여부 — 사다리·해설 gated 건너뛰기 {cycleIdx: bool}
      const [v1Pass, setV1Pass] = useState({});
      // ★ P3 자율성: 복수전 먼저 / 새 문제 먼저 — 시온이가 시작 화면에서 선택
      const [revengeFirst, setRevengeFirst] = useState(true);

      // 🧪 조작형 위젯 레지스트리 — 단원·약점 키워드 매칭으로 해당 step에 인라인 노출
      const [labWidgets, setLabWidgets] = useState([]);
      useEffect(() => {
        fetch("./diagrams/widgets.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null)
          .then(d => { if (d && d.widgets) setLabWidgets(d.widgets); }).catch(() => {});
      }, []);
      const matchWidget = (step) => {
        if (!labWidgets.length || !step) return null;
        const hay = [step.title, step.subject, step.unit, step.data && step.data["단원"], step.data && step.data.unit, step.data && step.data.name]
          .filter(Boolean).join(" ");
        return labWidgets.find(w =>
          (!w.subject || (step.subject || "").includes(w.subject) || hay.includes(w.subject)) &&
          (w.keywords || []).some(k => hay.includes(k))
        ) || null;
      };

      // 🔄 복수전·📚 단어·💬 자기설명 — 오늘 세트일 때만 (지난 날짜 따라잡기엔 미포함)
      const todaySet = selectedMeta === defaultMeta;
      const revengeItems = (todaySet && cfg.revenge && Array.isArray(cfg.revenge.items)) ? cfg.revenge.items : [];
      const vocabCards = (todaySet && cfg.vocab && Array.isArray(cfg.vocab.cards)) ? cfg.vocab.cards : [];
      const revengeSteps = revengeItems.map((it, i) => ({
        type: "quiz",
        title: `🔄 복수전 ${i+1}/${revengeItems.length} — ${it.label || "지난 오답"} 무찌르기! (+15 XP)`,
        data: { ...it.problem, id: `rev-${it.id}`, unit: it.단원, subject: it.과목, is_revenge: true },
        cycleIdx: -1,
      }));
      const vocabSteps = vocabCards.map((c, i) => ({
        type: "quiz",
        title: `📚 오늘의 단어 ${i+1}/${vocabCards.length} (+5 XP)`,
        data: { ...c, is_vocab: true },
        cycleIdx: -2,
      }));
      // 📖 이번 주 책 (P6) — 지문을 화면에 직접 보여주고 → 그 자리에서 읽고 → 문제 풀기
      const readingCfg = (todaySet && cfg.reading && Array.isArray(cfg.reading.cards) && cfg.reading.cards.length) ? cfg.reading : null;
      const readingQuizSteps = (readingCfg ? readingCfg.cards : []).map((c, i) => ({
        type: "quiz",
        title: `📖 「${readingCfg.book}」 문제 ${i+1}/${readingCfg.cards.length}`,
        data: { ...c },
        cycleIdx: -4,
        passage: readingCfg.passage || null,  // 문제 화면에서 "지문 다시 보기"
      }));
      const readingSteps = readingCfg ? [
        ...(readingCfg.passage ? [{
          type: "passage",
          cycleIdx: -4,
          book: readingCfg.book,
          range: readingCfg.range || "",
          intro: readingCfg.passage_intro || "",
          passage: readingCfg.passage,
        }] : []),
        ...readingQuizSteps,
      ] : [];
      const explainSteps = todaySet ? [{ type: "explain", cycleIdx: -3 }] : [];

      // 모든 사이클을 평탄화된 step 리스트로 (+ 복수전/책/단어/자기설명)
      const cycleSteps = problems.flatMap((p, idx) => {
        const steps = expandCycleToSteps(p);
        return steps.map(s => ({ ...s, cycleIdx: idx, cycleId: p.id, subject: s.subject || (s.data && s.data.subject) || p.subject, image_url: p.image_url, video_url: p.video_url, book_diagram_url: p.book_diagram_url, book_diagram_source: p.book_diagram_source }));
      });
      const allSteps = revengeFirst
        ? [...revengeSteps, ...cycleSteps, ...readingSteps, ...vocabSteps, ...explainSteps]
        : [...cycleSteps, ...revengeSteps, ...readingSteps, ...vocabSteps, ...explainSteps];

      const [stepIdx, setStepIdx] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [picked, setPicked] = useState(null);
      const [shortText, setShortText] = useState("");
      const [showFeedback, setShowFeedback] = useState(false);
      const [done, setDone] = useState(false);
      const [name, setName] = useState("시온");
      const [started, setStarted] = useState(false);
      const startRef = useRef(Date.now());
      // ✍️ 오늘의 필사 완료 상태 (localStorage 기반 — 진도는 update_game.py가 매일 자동 전진)
      const [cwDone, setCwDone] = useState(false);
      const [cwStreak, setCwStreak] = useState(0);

      useEffect(() => { setPicked(null); setShortText(""); setShowFeedback(false); }, [stepIdx]);

      // 필사 스트릭용 KST 날짜 (off일 전). UTC slice는 자정 경계서 하루 어긋남 → KST 보정
      function kstDate(off) { return new Date(Date.now() + 9*3600*1000 - (off||0)*86400000).toISOString().slice(0,10); }
      // 마운트 시 오늘 완료 여부 + 연속 스트릭 복원
      useEffect(() => {
        try {
          setCwStreak(parseInt(localStorage.getItem("cwStreak") || "0", 10));
          setCwDone(localStorage.getItem("cwLastDone") === kstDate(0));
        } catch (e) {}
      }, []);

      // 🔧 QA 점프 — URL 해시 #goto=passage|reading|vocab|revenge|explain (검수용, 해시 없으면 무동작)
      useEffect(() => {
        const m = (location.hash || "").match(/goto=(\w+)/);
        if (!m) return;
        const target = m[1];
        const findIdx = {
          passage: () => allSteps.findIndex(s => s.type === "passage"),
          reading: () => allSteps.findIndex(s => s.cycleIdx === -4),
          vocab:   () => allSteps.findIndex(s => s.cycleIdx === -2),
          revenge: () => allSteps.findIndex(s => s.cycleIdx === -1),
          explain: () => allSteps.findIndex(s => s.type === "explain"),
        }[target];
        const idx = findIdx ? findIdx() : -1;
        if (idx >= 0) { setHubMode(false); setStarted(true); setStepIdx(idx); }
      }, []);

      // gated step 숨김 — 변형1을 맞히면 그 사이클의 사다리·해설 자동 건너뜀
      function isStepHidden(s) { return !!(s && s.gated && v1Pass[s.cycleIdx] === true); }
      function nextVisibleIdx(from) {
        let n = from + 1;
        while (n < allSteps.length && isStepHidden(allSteps[n])) n++;
        return n;
      }
      // 🔮 선시도(찍기)는 점수에서 제외
      const scoredOf = arr => arr.filter(a => !a.is_prediction);

      // ✍️ "오늘 필사 다 했어요" — 하루 1회, 연속 스트릭 갱신 + 별도 시트탭 기록 (진도와 무관)
      function markCopyworkDone(cw) {
        try {
          const today = kstDate(0);
          if (localStorage.getItem("cwLastDone") === today) return; // 하루 1회만
          const prevStreak = parseInt(localStorage.getItem("cwStreak") || "0", 10);
          const newStreak = (localStorage.getItem("cwLastDone") === kstDate(1)) ? prevStreak + 1 : 1; // 어제 했으면 +1, 끊겼으면 1
          localStorage.setItem("cwLastDone", today);
          localStorage.setItem("cwStreak", String(newStreak));
          setCwDone(true); setCwStreak(newStreak);
          if (window.GameSFX?.finish) window.GameSFX.finish();
          recordResult({
            game: cfg.game, sheet_tab: "sion-copywork", player: name,
            score: 0, total: 0,
            meta: { type: "copywork_done", date: today, page: cw?.page, total_pages: cw?.total, title: cw?.title, streak: newStreak },
          });
        } catch (e) {}
      }

      // 허브 모드: 날짜 리스트 표시
      if (hubMode && archiveIndex && archiveIndex.days && archiveIndex.days.length > 0) {
        const today = new Date().toISOString().slice(0,10);
        const stats = solveStats?.totals;
        const byDate = solveStats?.byDate || {};
        const fmtAttempt = (a) => {
          const pct = a.score / a.total;
          let emoji = "💪";
          if (a.score === a.total) emoji = "🏆";
          else if (pct >= 0.8) emoji = "✨";
          else if (pct >= 0.6) emoji = "👍";
          else emoji = "🔄";
          const mm = Math.floor(a.dur/60), ss = a.dur%60;
          return `${emoji} ${a.score}/${a.total} (${mm}:${String(ss).padStart(2,'0')})`;
        };
        const dash = cfg.dashboard || null;
        const cw = cfg.copywork || null;
        return (
          <div className="card">
            <h1 className="title">📚 시온이 학습 허브</h1>
            <p className="subtitle">오늘 자료 + 빼먹은 날 따라잡기</p>

            {/* 💌 소통 — 시온이↔아빠 매일 한 마디 (허브 최상단) */}
            <div style={{
              margin:"14px 0 18px", padding:"16px 14px",
              background:"linear-gradient(135deg, #fff0f6 0%, #ffe8f0 100%)",
              borderRadius:18, border:"2px solid #ffb3d1",
            }}>
              <div style={{fontSize:"1.05em", fontWeight:800, color:"#d6336c", marginBottom:10}}>
                💌 아빠랑 한 마디
              </div>

              {/* 최근 대화 (아빠 답장 포함) */}
              {messages.length > 0 && (
                <div style={{
                  marginBottom:12, maxHeight:180, overflowY:"auto",
                  display:"flex", flexDirection:"column", gap:6,
                }}>
                  {messages.map((m, i) => {
                    const isSion = m.who === "시온";
                    return (
                      <div key={i} style={{
                        alignSelf: isSion ? "flex-end" : "flex-start",
                        maxWidth:"82%",
                        background: isSion ? "#ffd6e7" : "#d6e4ff",
                        color:"#333", borderRadius:14,
                        padding:"7px 12px", fontSize:"0.88em", lineHeight:1.5,
                        borderBottomRightRadius: isSion ? 4 : 14,
                        borderBottomLeftRadius: isSion ? 14 : 4,
                      }}>
                        <div style={{fontSize:"0.72em", fontWeight:700, color: isSion ? "#d6336c" : "#3b5bdb", marginBottom:2}}>
                          {isSion ? "시온이" : "💙 아빠"}
                        </div>
                        {m.text}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* 시온이 입력 */}
              {msgSent ? (
                <div style={{textAlign:"center", color:"#d6336c", fontWeight:700, padding:"8px 0"}}>
                  💝 아빠에게 전했어! 답장을 기다려보자.
                </div>
              ) : (
                <div style={{display:"flex", gap:8, alignItems:"flex-end"}}>
                  <textarea
                    value={myMsg}
                    onChange={e => setMyMsg(e.target.value)}
                    placeholder="오늘 아빠에게 하고 싶은 말을 적어줘 ✍️"
                    rows={2}
                    style={{
                      flex:1, borderRadius:12, border:"1px solid #ffb3d1",
                      padding:"8px 10px", fontSize:"0.9em", resize:"none",
                      fontFamily:"inherit",
                    }}
                  />
                  <button
                    onClick={sendMyMessage}
                    disabled={!myMsg.trim()}
                    style={{
                      background: myMsg.trim() ? "#d6336c" : "#f0c0d4",
                      color:"#fff", border:"none", borderRadius:12,
                      padding:"10px 16px", fontWeight:800, fontSize:"0.9em",
                      cursor: myMsg.trim() ? "pointer" : "default", flexShrink:0,
                    }}
                  >보내기</button>
                </div>
              )}
            </div>

            {/* 🏅 이번 주 시온이가 이긴 것 (P3 — 약점이 아니라 승리 중심 피드백) */}
            {weeklyRecap && weeklyRecap.wins && weeklyRecap.wins.length > 0 && (
              <div style={{
                margin:"14px 0 18px", padding:"14px 16px",
                background:"linear-gradient(135deg, #f0fff4 0%, #e0f7ea 100%)",
                borderRadius:18, border:"2px solid #7ed8a8",
              }}>
                <div style={{fontSize:"1.05em", fontWeight:800, color:"#1d7a4a", marginBottom:8}}>
                  🏅 이번 주 네가 이긴 것
                </div>
                {weeklyRecap.wins.map((w, i) => (
                  <div key={i} style={{fontSize:"0.9em", padding:"4px 0", color:"#2a5a3a", lineHeight:1.5}}>{w}</div>
                ))}
                {weeklyRecap.message && (
                  <div style={{fontSize:"0.78em", color:"#5a8a6a", marginTop:8, fontStyle:"italic"}}>
                    {weeklyRecap.message}
                  </div>
                )}
              </div>
            )}

            {/* ✍️ 오늘의 필사 — 보고 공책에 적기 (인쇄 불필요) */}
            {/* 영어책은 본문+해석 2장 함께 표시 (images 배열) */}
            {cw && (cw.images?.length || cw.image) && (() => {
              const imgs = cw.images && cw.images.length ? cw.images : [cw.image];
              return (
              <div style={{
                margin:"14px 0 18px", padding:"14px",
                background:"linear-gradient(135deg, #fffaf0 0%, #fff5e6 100%)",
                borderRadius:18, border:"2px solid #ffd9a0",
              }}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
                  <div style={{fontSize:"1.05em", fontWeight:800, color:"#b8741a"}}>
                    ✍️ 오늘의 필사
                  </div>
                  <div style={{fontSize:"0.78em", color:"#999"}}>
                    {cw.page} / {cw.total} 쪽{imgs.length > 1 ? ` (${imgs.length}장)` : ""}
                  </div>
                </div>
                <div style={{fontSize:"0.82em", color:"#888", marginBottom:8}}>
                  📖 {cw.title}{imgs.length > 1 ? "  ·  본문 + 해석" : ""}
                </div>
                {imgs.map((im, i) => (
                  <img key={i} src={`${im}?v=${cw.date}`} alt={`오늘의 필사 ${i+1}`}
                    style={{width:"100%", borderRadius:12, border:"1px solid #eedcc0", display:"block", marginBottom: i < imgs.length-1 ? 10 : 0}}
                    onError={(e)=>{e.target.style.display="none";}}
                  />
                ))}
                <div style={{fontSize:"0.72em", color:"#aa8855", marginTop:8, textAlign:"center", fontStyle:"italic"}}>
                  {imgs.length > 1 ? "영어 원문을 보고 적은 뒤, 해석으로 뜻을 확인해 ✏️" : "화면을 보고 공책에 또박또박 따라 써 보자 ✏️"}
                </div>
                {/* ✍️ 완료 버튼 / 완료 상태 — 진도 전진 아님(매일 자동), 격려·스트릭·부모확인 */}
                {cwDone ? (
                  <div style={{
                    marginTop:12, padding:"12px", borderRadius:14, textAlign:"center",
                    background:"linear-gradient(135deg,#5ed5a0,#3bbf86)", color:"#fff", fontWeight:800,
                    boxShadow:"0 4px 12px rgba(59,191,134,0.3)",
                  }}>
                    ✅ 오늘 필사 완료!{cwStreak > 1 ? `  🔥 ${cwStreak}일 연속` : ""}
                  </div>
                ) : (
                  <button onClick={() => markCopyworkDone(cw)} style={{
                    marginTop:12, width:"100%", padding:"13px", borderRadius:14, border:"none",
                    background:"linear-gradient(135deg,#ffb347,#ff9020)", color:"#fff",
                    fontSize:"1.05em", fontWeight:800, cursor:"pointer",
                    boxShadow:"0 4px 12px rgba(255,144,32,0.35)",
                  }}>
                    ✍️ 오늘 필사 다 했어요!{cwStreak > 0 ? `  🔥 ${cwStreak}일 연속 도전 중` : ""}
                  </button>
                )}
              </div>
              );
            })()}

            {/* Phase 1+2 대시보드 — 시온이의 수능 여정 (9년 로드맵 + XP/레벨) */}
            {dash && dash.영역별 && (
              <div style={{
                margin:"14px 0 20px",
                background:"linear-gradient(135deg, #fef3ff 0%, #e8efff 60%, #f0fff4 100%)",
                borderRadius:20,
                padding:"18px 16px",
                border:"2px solid #d4c5ff",
              }}>
                {/* Phase 2: Lv N + XP 막대 (도파민 트리거) */}
                {dash.level && (
                  <div style={{
                    background:"linear-gradient(135deg, #4a2d8a 0%, #7d3ce0 100%)",
                    color:"#fff", borderRadius:14, padding:"10px 14px",
                    marginBottom:14, boxShadow:"0 4px 12px rgba(125,60,224,0.3)",
                  }}>
                    <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
                      <div>
                        <span style={{fontSize:"1.4em", fontWeight:900}}>Lv {dash.level}</span>
                        <span style={{fontSize:"0.85em", marginLeft:8, opacity:0.85}}>시온이 · Chapter {dash.chapter}</span>
                      </div>
                      <div style={{fontSize:"0.85em", opacity:0.9}}>
                        XP {dash.xp_total} · 🏆 {dash.master_units}
                      </div>
                    </div>
                    <div style={{height:8, background:"rgba(255,255,255,0.2)", borderRadius:5, overflow:"hidden"}}>
                      <div style={{
                        width:`${dash.xp_in_level}%`, height:"100%",
                        background:"linear-gradient(90deg, #ffd700, #ffaa3a)",
                        boxShadow:"0 0 8px rgba(255,215,0,0.6)",
                        transition:"width 0.6s",
                      }}></div>
                    </div>
                    <div style={{fontSize:"0.72em", opacity:0.85, marginTop:4, textAlign:"right"}}>
                      다음 레벨까지 {100-dash.xp_in_level} XP
                    </div>
                  </div>
                )}

                <div style={{textAlign:"center", marginBottom:14}}>
                  <div style={{fontSize:"1.15em", fontWeight:800, color:"#4a2d8a"}}>
                    📖 시온이의 학습 모험
                  </div>
                  <div style={{fontSize:"0.82em", color:"#888", marginTop:3}}>
                    Chapter {dash.chapter} / {dash.chapter_total} — 매일 한 걸음 🌱
                  </div>
                </div>

                {/* 5챕터 로드맵 (게임 챕터 메타포 — "수능"·"고3"·"9년" 단어 제거) */}
                {dash.roadmap && (
                  <div style={{marginBottom:16}}>
                    <div style={{
                      display:"flex", justifyContent:"space-between", alignItems:"center",
                      position:"relative", padding:"4px 6px",
                    }}>
                      <div style={{
                        position:"absolute", top:"50%", left:"7%", right:"7%",
                        height:3, background:"linear-gradient(90deg, #b48dff 0%, #b48dff 50%, #e0e0e0 50%, #e0e0e0 100%)",
                        zIndex:0,
                      }}></div>
                      {dash.roadmap.map((r, i) => {
                        const bg = r.status==="done" ? "#5ed5a0"
                                 : r.status==="current" ? "#ff8fc5"
                                 : "#e0d8ec";
                        const ring = r.status==="current" ? "0 0 0 4px rgba(255,143,197,0.35), 0 0 14px rgba(255,143,197,0.6)" : "none";
                        return (
                          <div key={r.grade} title={`${r.label} · ${r.milestone}`} style={{
                            position:"relative", zIndex:1, textAlign:"center",
                          }}>
                            <div style={{
                              width:38, height:38, borderRadius:"50%",
                              background:bg, color:"#fff",
                              display:"flex", alignItems:"center", justifyContent:"center",
                              fontWeight:800, fontSize:"0.82em",
                              boxShadow:ring,
                              border:"2px solid #fff",
                              animation: r.status==="current" ? "pulse 2s infinite" : "none",
                            }}>
                              {r.status==="done" ? "✓" : r.status==="current" ? "📍" : (i===4 ? "🎓" : "🔒")}
                            </div>
                            <div style={{fontSize:"0.66em", marginTop:3, color:"#555", fontWeight:700}}>
                              {r.short}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{fontSize:"0.78em", color:"#6b4ba8", textAlign:"center", marginTop:8, fontWeight:600}}>
                      {dash.roadmap.find(r=>r.status==="current")?.milestone || ""}
                    </div>
                  </div>
                )}

                {/* 5챕터 전체 진행 막대 (큰 그림, 부담 단어 X) */}
                <div style={{marginBottom:16}}>
                  <div style={{display:"flex", justifyContent:"space-between", fontSize:"0.78em", color:"#666", marginBottom:5}}>
                    <span>📍 현재</span>
                    <span style={{fontWeight:800, color:"#4a2d8a", fontSize:"1.4em"}}>{dash.overall_progress}%</span>
                    <span>🎓 엔딩</span>
                  </div>
                  <div style={{height:14, background:"#f0e8ff", borderRadius:8, overflow:"hidden", position:"relative"}}>
                    <div style={{
                      width:`${dash.overall_progress}%`,
                      height:"100%",
                      background:"linear-gradient(90deg, #ff8fc5, #b48dff, #5ba0ff)",
                      transition:"width 0.6s",
                    }}></div>
                  </div>
                </div>

                {/* streak·풀이 통계 */}
                <div style={{
                  display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8,
                  textAlign:"center", marginBottom:14, fontSize:"0.85em",
                }}>
                  <div style={{background:"#fff", borderRadius:10, padding:"8px 4px"}}>
                    <div style={{fontSize:"1.4em", fontWeight:800, color:"#ff6b35"}}>🔥 {dash.streak_days}</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>연속일 (최장 {dash.longest_streak})</div>
                  </div>
                  <div style={{background:"#fff", borderRadius:10, padding:"8px 4px"}}>
                    <div style={{fontSize:"1.4em", fontWeight:800, color:"#4a90e2"}}>💪 {dash.accuracy}%</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>정답률 ({dash.total_correct}/{dash.total_plays})</div>
                  </div>
                  <div style={{background:"#fff", borderRadius:10, padding:"8px 4px"}}>
                    <div style={{fontSize:"1.4em", fontWeight:800, color:"#6b4ba8"}}>📅 {dash.last_date.slice(5).replace('-','/')}</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>마지막 풀이</div>
                  </div>
                </div>

                {/* 5영역 진행 게이지 (대칭화) */}
                <div style={{fontSize:"0.75em", color:"#666", fontWeight:700, marginBottom:6}}>📊 5영역 진행도 (대칭화)</div>
                {dash.영역별.filter(s => s.subject !== "한국사" || s.progress > 0).map(s => {
                  const masterIcon = s.recent_accuracy.length >= 3 && s.recent_accuracy.slice(-3).every(r => r >= 0.9) ? " ⭐" : "";
                  return (
                    <div key={s.subject} style={{marginBottom:8}}>
                      <div style={{display:"flex", justifyContent:"space-between", fontSize:"0.82em", marginBottom:3}}>
                        <span style={{fontWeight:700, color:s.color}}>
                          {s.subject}{masterIcon}
                          {s.weak_count > 0 && <span style={{color:"#e94545", fontSize:"0.85em", marginLeft:5}}>⚠️{s.weak_count}</span>}
                          {s.strong_count > 0 && <span style={{color:"#f5b91a", fontSize:"0.85em", marginLeft:3}}>⭐{s.strong_count}</span>}
                        </span>
                        <span style={{color:"#555", fontSize:"0.9em"}}>{s.progress}% · {s.current_unit.slice(0,18)}</span>
                      </div>
                      <div style={{height:8, background:"#f5f0fa", borderRadius:5, overflow:"hidden"}}>
                        <div style={{
                          width:`${s.progress}%`, height:"100%",
                          background:`linear-gradient(90deg, ${s.color}aa, ${s.color})`,
                          transition:"width 0.5s",
                        }}></div>
                      </div>
                    </div>
                  );
                })}

                {/* 약점 보스 + 강점 스킬 요약 */}
                <div style={{
                  marginTop:14, padding:"10px 12px",
                  background:"rgba(255,255,255,0.6)", borderRadius:10,
                  fontSize:"0.82em", color:"#555", textAlign:"center",
                }}>
                  ⚔️ <b>{dash.영역별.reduce((s,a)=>s+a.weak_count,0)}</b>개 약점 보스 클리어 대기 ·
                  🏆 <b>{dash.영역별.reduce((s,a)=>s+a.strong_count,0)}</b>개 마스터 스킬 획득
                </div>

                {/* Phase 6a: 영역별 진화 계통수 (스킬 트리) */}
                {dash.skill_tree && (
                  <div style={{
                    marginTop:12, padding:"12px 10px",
                    background:"rgba(255,255,255,0.7)", borderRadius:12,
                  }}>
                    <div style={{
                      fontSize:"0.82em", fontWeight:800, color:"#4a2d8a",
                      marginBottom:8, textAlign:"center",
                    }}>
                      🌳 진화 계통수 — 단원 모듈 연결
                    </div>
                    {Object.entries(dash.skill_tree).map(([subj, nodes]) => {
                      const subjColor = dash.영역별.find(x=>x.subject===subj)?.color || "#999";
                      const trackColors = {
                        "대수":"#ff6b6b","기하":"#4ecdc4","통계":"#ffd166","융합":"#a78bfa",
                        "분기":"#f9a8d4","문법":"#60a5fa","독해":"#34d399","수능":"#fb923c",
                        "문학":"#f472b6","비문학":"#818cf8","공통":subjColor,"통과":"#5ed5a0","통사":"#ffc861"
                      };

                      // Phase 9: 학년 표시 제거 — 시온이 시점 부담 단어 0
                      // 노드 = 개념·주제만 (모듈화 순수성)
                      if (false && subj === "수학" && nodes.some(n=>typeof n.row==="number")) {
                        // 수학 전용: 두 줄 분기 진화
                        const nodeW = 30, gap = 16, totalW = nodes.length * (nodeW + gap);
                        const yTop = 28, yMid = 60, yBot = 92;
                        const positions = nodes.map((n, i) => {
                          const x = i * (nodeW + gap) + nodeW/2;
                          const y = n.row === 0 ? yTop : n.row === 1 ? yBot : yMid;
                          return {x, y, n, i};
                        });
                        return (
                          <div key={subj} style={{marginBottom:12}}>
                            <div style={{
                              fontSize:"0.7em", fontWeight:700, color:subjColor,
                              marginBottom:4, paddingLeft:2,
                            }}>{subj} — 🌱 자연수 → ⚡대수 줄기 / 📐기하 줄기 → 🌈 합류 (미적분·통계)</div>
                            <div style={{overflowX:"auto", paddingBottom:4}}>
                              <svg width={totalW} height={120} style={{minWidth:totalW}}>
                                {/* 분기/합류 연결선 */}
                                {positions.map((p, i) => {
                                  if (i === positions.length - 1) return null;
                                  const next = positions[i+1];
                                  const isDone = p.n.status === "done";
                                  const color = isDone ? "#5ed5a0" :
                                                next.n.status==="current" ? "#ff8fc5" : "#d4c5ff";
                                  return (
                                    <line key={`l${i}`}
                                      x1={p.x} y1={p.y} x2={next.x} y2={next.y}
                                      stroke={color} strokeWidth={isDone ? 3 : 2}
                                      strokeDasharray={isDone ? "" : "4,3"}
                                    />
                                  );
                                })}
                                {/* 노드 */}
                                {positions.map((p) => {
                                  const bg = p.n.status==="done" ? "#5ed5a0"
                                           : p.n.status==="current" ? "#ff8fc5"
                                           : "#e8e0f0";
                                  const trackC = trackColors[p.n.track] || "#ccc";
                                  const isBranch = p.n.branch === "merge" || p.n.branch === "start" || p.n.branch === "final";
                                  const r = p.n.status==="current" ? 13 : isBranch ? 12 : 10;
                                  return (
                                    <g key={p.n.id}>
                                      <circle cx={p.x} cy={p.y} r={r} fill={bg}
                                        stroke={trackC} strokeWidth={isBranch?3:2}/>
                                      {p.n.status==="done" && (
                                        <text x={p.x} y={p.y+4} textAnchor="middle"
                                          fontSize="11" fill="#fff" fontWeight="800">✓</text>
                                      )}
                                      {p.n.status==="current" && (
                                        <text x={p.x} y={p.y+4} textAnchor="middle"
                                          fontSize="11">📍</text>
                                      )}
                                    </g>
                                  );
                                })}
                                {/* 줄기 라벨 */}
                                <text x={2} y={yTop+4} fontSize="8" fill="#888" fontWeight="700">⚡대수</text>
                                <text x={2} y={yBot+4} fontSize="8" fill="#888" fontWeight="700">📐기하</text>
                              </svg>
                            </div>
                            {(() => {
                              const cur = nodes.find(n=>n.status==="current");
                              const curIdx = nodes.indexOf(cur);
                              return cur ? (
                                <div style={{fontSize:"0.65em", color:"#666", marginTop:2, paddingLeft:2}}>
                                  📍 <b>{cur.name}</b> ({cur.grade}, {cur.track} 가지) · 다음: {nodes[curIdx+1]?.name || "엔딩"}
                                </div>
                              ) : null;
                            })()}
                          </div>
                        );
                      }
                      // Phase 9: 학년 표시 가림 — 개념·주제만 (부담 단어 0). 색은 단계별 농도로만 차별.
                      // 단계 색 = 시각 차이만 유지 (의미는 시온이에게 노출 X)
                      const stageColors = ["#fce4ec","#fda4af","#5ba0ff","#3b82f6","#1d4ed8","#10b981","#059669","#047857"];
                      const gradeToStage = {"초5":0,"초6":1,"중1":2,"중2":3,"중3":4,"고1":5,"고2":6,"고3":7};
                      const curNode = nodes.find(n=>n.status==="current");
                      const curIdx = curNode ? nodes.indexOf(curNode) : -1;
                      const doneCount = nodes.filter(n=>n.status==="done").length;

                      return (
                        <div key={subj} style={{marginBottom:12}}>
                          <div style={{
                            display:"flex", justifyContent:"space-between", alignItems:"center",
                            fontSize:"0.7em", fontWeight:700, color:subjColor,
                            marginBottom:4, paddingLeft:2,
                          }}>
                            <span>{subj}</span>
                            <span style={{color:"#888", fontWeight:500, fontSize:"0.9em"}}>
                              {doneCount} / {nodes.length} 모듈 ✓
                            </span>
                          </div>
                          {/* 노드 가로 스크롤 띠 — 학년 라벨 X, 개념만 */}
                          <div style={{
                            display:"flex", overflowX:"auto", gap:0,
                            alignItems:"center", padding:"4px 0",
                            scrollSnapType:"x mandatory",
                          }}>
                            {nodes.map((n, i) => {
                              const bg = n.status==="done" ? "#5ed5a0"
                                       : n.status==="current" ? "#ff8fc5"
                                       : "#e8e0f0";
                              const ring = n.status==="current" ? "0 0 10px rgba(255,143,197,0.8)" : "none";
                              const stage = gradeToStage[n.grade] || 0;
                              const trackC = stageColors[stage] || "#ccc";
                              return (
                                <React.Fragment key={n.id}>
                                  <div title={n.name} style={{
                                    minWidth: n.status==="current" ? 22 : 14,
                                    height: n.status==="current" ? 22 : 14,
                                    borderRadius:"50%", background:bg,
                                    border:`2px solid ${trackC}`,
                                    display:"flex", alignItems:"center", justifyContent:"center",
                                    fontSize: n.status==="current" ? "0.62em" : "0.45em",
                                    fontWeight:800, color:"#fff",
                                    boxShadow:ring, flexShrink:0,
                                    animation: n.status==="current" ? "pulse 2s infinite" : "none",
                                    scrollSnapAlign:"start",
                                  }}>
                                    {n.status==="done" ? "✓" : n.status==="current" ? "📍" : ""}
                                  </div>
                                  {i < nodes.length - 1 && (
                                    <div style={{
                                      flex:"0 0 auto", minWidth:6, height:2,
                                      background: nodes[i].status==="done"
                                        ? (nodes[i+1].status==="current" ? "linear-gradient(90deg, #5ed5a0, #ff8fc5)" : "#5ed5a0")
                                        : "#e0d8ec",
                                    }}></div>
                                  )}
                                </React.Fragment>
                              );
                            })}
                          </div>
                          {/* 현재 + 다음 모듈명 (학년 표시 X) */}
                          {curNode && (
                            <div style={{fontSize:"0.65em", color:"#666", marginTop:3, paddingLeft:2}}>
                              📍 <b>{curNode.name}</b> · 다음 모듈: {nodes[curIdx+1]?.name || "🎓 엔딩"}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    <div style={{
                      fontSize:"0.62em", color:"#888", marginTop:6, textAlign:"center",
                      fontStyle:"italic",
                    }}>
                      각 노드 = 1개 단원 모듈 (1개념 1주제) · 좌우 스크롤로 모듈 진보 확인
                    </div>
                  </div>
                )}

                {/* Phase 3: 트로피 진열장 */}
                {dash.trophies && dash.trophies.length > 0 && (
                  <div style={{
                    marginTop:12, padding:"14px 12px",
                    background:"linear-gradient(135deg, #fffbeb 0%, #fff4d6 100%)",
                    borderRadius:14, border:"2px solid #ffd76b",
                  }}>
                    <div style={{
                      fontSize:"0.85em", fontWeight:800, color:"#9c6b00",
                      marginBottom:10, textAlign:"center",
                    }}>
                      🏆 트로피 진열장 ({dash.trophies.length})
                    </div>
                    <div style={{
                      display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(140px, 1fr))",
                      gap:8,
                    }}>
                      {dash.trophies.map((t, i) => (
                        <div key={i} style={{
                          background:"#fff", borderRadius:10, padding:"8px 10px",
                          borderLeft:`4px solid ${t.color}`,
                          boxShadow:"0 2px 6px rgba(0,0,0,0.05)",
                          animation: "trophy-shine 3s ease-in-out infinite",
                        }}>
                          <div style={{fontSize:"1.4em", marginBottom:2}}>🏆</div>
                          <div style={{fontSize:"0.78em", fontWeight:800, color:t.color}}>
                            {t.subject}
                          </div>
                          <div style={{fontSize:"0.7em", color:"#666", marginTop:2}}>
                            {t.unit.slice(0,20)}
                          </div>
                          <div style={{fontSize:"0.66em", color:"#999", marginTop:3}}>
                            {t.accuracy}% · {t.date.slice(5).replace('-','/')}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {stats && (
              <div style={{
                margin:"14px 0 20px",
                background:"linear-gradient(135deg, #fff0f7 0%, #f0e8ff 100%)",
                borderRadius:18,
                padding:"16px 14px",
              }}>
                <div style={{textAlign:"center", color:"#6b4ba8", fontWeight:700, fontSize:"1.05em", marginBottom:10}}>
                  🎯 시온이 전적
                </div>
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, textAlign:"center"}}>
                  <div>
                    <div style={{fontSize:"1.5em", fontWeight:700, color:"#c87800"}}>{stats.streak}</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>🔥 연속일</div>
                  </div>
                  <div>
                    <div style={{fontSize:"1.5em", fontWeight:700, color:"#6b4ba8"}}>{stats.days}</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>📅 참여일</div>
                  </div>
                  <div>
                    <div style={{fontSize:"1.5em", fontWeight:700, color:"#4caf50"}}>{Math.round(stats.rate*100)}%</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>✅ 정답률</div>
                  </div>
                  <div>
                    <div style={{fontSize:"1.5em", fontWeight:700, color:"#ff6f61"}}>{stats.perfect}</div>
                    <div style={{fontSize:"0.78em", color:"#888"}}>🏆 만점</div>
                  </div>
                </div>
                <div style={{textAlign:"center", marginTop:10, fontSize:"0.85em", color:"#666"}}>
                  총 {stats.attempts}번 도전 · {stats.correct}/{stats.solved}문제 맞춤
                </div>
              </div>
            )}

            <div style={{margin:"0 0 14px", textAlign:"center", color:"#666", fontSize:"0.9em"}}>
              총 {archiveIndex.days.length}일치 학습 자료 누적
            </div>
            <div style={{display:"grid", gap:10}}>
              {archiveIndex.days.map((d, i) => {
                const isToday = d.date === today;
                const attempts = byDate[d.date] || [];
                const solved = attempts.length > 0;
                const best = solved ? attempts.reduce((a,b) => (b.score/b.total > a.score/a.total ? b : a)) : null;
                const allPerfect = solved && attempts.every(a => a.score === a.total);
                const bgColor = isToday
                  ? "linear-gradient(135deg, #ff8fc5, #b48dff)"
                  : allPerfect
                  ? "linear-gradient(135deg, #fff8d4, #ffe8a0)"
                  : solved
                  ? "linear-gradient(135deg, #e8f7e8, #d4f5d4)"
                  : "white";
                const borderColor = isToday ? "none"
                  : allPerfect ? "2px solid #ffc107"
                  : solved ? "2px solid #4caf50"
                  : "2px solid #e8d5ff";
                return (
                  <button
                    key={i}
                    onClick={() => loadDay(d.date)}
                    style={{
                      background: bgColor,
                      color: isToday ? "white" : "#2a2a3a",
                      border: borderColor,
                      borderRadius: 14,
                      padding: "14px 18px",
                      textAlign: "left",
                      cursor: "pointer",
                      fontSize: "0.98em",
                      fontFamily: "inherit",
                    }}
                  >
                    <div style={{fontWeight:700, fontSize:"1.05em", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:6}}>
                      <span>{isToday && "🔥 "}{allPerfect && !isToday && "👑 "} {d.date} ({d.weekday})</span>
                      {solved && (
                        <span style={{fontSize:"0.85em", fontWeight:700, color: isToday ? "white" : "#2a7a2a"}}>
                          {attempts.length === 1 ? fmtAttempt(attempts[0]) : `${attempts.length}회 도전 · 최고 ${best.score}/${best.total}`}
                        </span>
                      )}
                      {!solved && !isToday && (
                        <span style={{fontSize:"0.8em", color:"#888", fontWeight:600}}>💪 도전!</span>
                      )}
                    </div>
                    <div style={{fontSize:"0.85em", marginTop:4, opacity:0.85}}>
                      {d.subjects.join(" · ")} · {d.cycle_count}사이클
                    </div>
                    {d.현재단원 && (
                      <div style={{fontSize:"0.82em", marginTop:3, opacity:0.7}}>
                        📍 {d.현재단원}
                      </div>
                    )}
                    {solved && attempts.length > 1 && (
                      <div style={{fontSize:"0.78em", marginTop:5, opacity:0.85}}>
                        {attempts.map((a,j) => <span key={j} style={{marginRight:8}}>{fmtAttempt(a)}</span>)}
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
            {defaultProblems.length > 0 && (
              <div style={{marginTop:18, textAlign:"center"}}>
                <button className="btn" onClick={() => { setSelectedProblems(defaultProblems); setSelectedMeta(defaultMeta); setSelectedDate(defaultMeta.generated_at||""); setHubMode(false); }}>
                  오늘 바로 시작 ▶
                </button>
              </div>
            )}
          </div>
        );
      }

      if (problems.length === 0) {
        return (
          <div className="card empty">
            <div className="empty-emoji">📚</div>
            <h2 style={{color:"#6b4ba8"}}>오늘의 학습 준비 중</h2>
            <p style={{marginTop:10, color:"#666"}}>곧 새 문제가 올라와요!</p>
            <p style={{marginTop:6, fontSize:"0.9em", color:"#999"}}>마지막 갱신: {meta.generated_at || "—"}</p>
          </div>
        );
      }

      if (!started) {
        const cycles = problems.length;
        return (
          <div className="card">
            {!hubMode && archiveIndex && archiveIndex.days && archiveIndex.days.length > 1 && (
              <div style={{marginBottom:10}}>
                <button className="btn btn-ghost" style={{padding:"6px 14px", fontSize:"0.88em"}} onClick={backToHub}>
                  ◀ 허브로
                </button>
              </div>
            )}
            <h1 className="title">📚 {cfg.title || "시온이 학습"}</h1>
            <p className="subtitle">{selectedDate || meta.generated_at} · {cycles}사이클 · 수능 기출 학습</p>
            {meta.weakness_focus && meta.weakness_focus.length > 0 && (
              <div style={{textAlign:"center", marginBottom:16}}>
                <div style={{fontSize:"0.9em", color:"#666", marginBottom:6}}>오늘의 집중</div>
                {meta.weakness_focus.map((f,i) => <span key={i} className="focus-tag">{f}</span>)}
              </div>
            )}
            {new Date().getDay() === 0 && (
              <div style={{textAlign:"center", margin:"10px 0", padding:"10px 14px",
                background:"#fff8e1", borderRadius:12, fontSize:"0.9em", color:"#9c6b00", fontWeight:700}}>
                😌 오늘은 일요일 — 복수전·단어만 가볍게 해도 충분해!
              </div>
            )}
            {/* ★ P3 자율성 — 시온이가 오늘 순서를 고른다 */}
            {revengeItems.length > 0 && (
              <div style={{textAlign:"center", margin:"14px 0 4px"}}>
                <div style={{fontSize:"0.85em", color:"#666", marginBottom:8}}>오늘 순서, 네가 골라 👇</div>
                <div style={{display:"inline-flex", gap:8}}>
                  <button onClick={() => setRevengeFirst(true)}
                    style={{
                      padding:"9px 16px", borderRadius:12, fontFamily:"inherit", fontWeight:800,
                      fontSize:"0.9em", cursor:"pointer",
                      border: revengeFirst ? "2px solid #c0392b" : "2px solid #e8d5ff",
                      background: revengeFirst ? "#ffe3e0" : "white",
                      color: revengeFirst ? "#c0392b" : "#888",
                    }}>⚔️ 복수전 먼저</button>
                  <button onClick={() => setRevengeFirst(false)}
                    style={{
                      padding:"9px 16px", borderRadius:12, fontFamily:"inherit", fontWeight:800,
                      fontSize:"0.9em", cursor:"pointer",
                      border: !revengeFirst ? "2px solid #6b4ba8" : "2px solid #e8d5ff",
                      background: !revengeFirst ? "#f0e8ff" : "white",
                      color: !revengeFirst ? "#6b4ba8" : "#888",
                    }}>✨ 새 문제 먼저</button>
                </div>
              </div>
            )}
            {/* 🧪 실험실 — 조작형 위젯 상설 입구 (widgets.json) */}
            {labWidgets.length > 0 && (
              <div style={{textAlign:"center", margin:"14px 0 4px"}}>
                <div style={{fontSize:"0.85em", color:"#666", marginBottom:8}}>🧪 실험실 — 게이지 움직이며 개념 익히기</div>
                <div style={{display:"inline-flex", gap:8, flexWrap:"wrap", justifyContent:"center"}}>
                  {labWidgets.map((w, i) => (
                    <a key={i} href={"./diagrams/" + w.file} target="_blank" rel="noreferrer"
                      style={{padding:"9px 16px", borderRadius:12, fontWeight:800, fontSize:"0.9em",
                        textDecoration:"none", border:"2px solid #b48dff", background:"#f7f2ff", color:"#6b4ba8"}}>
                      🧪 {w.title}
                    </a>
                  ))}
                </div>
              </div>
            )}
            <div style={{margin:"22px 0", textAlign:"center"}}>
              <input className="short-input" style={{maxWidth:240, textAlign:"center"}} value={name} onChange={e => setName(e.target.value)} placeholder="이름" />
            </div>
            <div style={{textAlign:"center"}}>
              <button className="btn" onClick={() => { setStarted(true); startRef.current = Date.now(); }}>시작하기 ▶</button>
            </div>
            <p style={{textAlign:"center", marginTop:14, color:"#888", fontSize:"0.88em"}}>
              {revengeItems.length > 0 && `⚔️ 복수전 ${revengeItems.length} · `}
              🎯 찍어보기 → 🎲 먼저 도전 → (틀리면) 🪜 사다리 → 🎲 재도전
              {vocabCards.length > 0 && ` · 📚 단어 ${vocabCards.length}`}
            </p>
          </div>
        );
      }

      if (done) {
        const scored = scoredOf(answers);
        const correct = scored.filter(a => a.correct).length;
        const total = scored.length;
        const pct = total > 0 ? Math.round((correct/total)*100) : 100;
        const dur = Math.round((Date.now() - startRef.current)/1000);
        const wrongUnits = [...new Set(scored.filter(a => !a.correct).map(a => a.unit))];
        const revengeWins = scored.filter(a => String(a.id||"").startsWith("rev-") && a.correct).length;
        const vocabWins = scored.filter(a => String(a.id||"").startsWith("voc-") && a.correct).length;
        return (
          <div className="card" style={{textAlign:"center"}}>
            <h1 className="title">🎉 수고했어 시온!</h1>
            <div className="result-score">{correct}<span style={{fontSize:"0.5em", color:"#888"}}>/{total}</span></div>
            <p className="subtitle">{pct}점 · {Math.floor(dur/60)}분 {dur%60}초</p>
            {(revengeWins > 0 || vocabWins > 0) && (
              <p style={{fontSize:"0.95em", color:"#6b4ba8", fontWeight:700, marginTop:4}}>
                {revengeWins > 0 && `⚔️ 복수전 ${revengeWins}승 `}
                {vocabWins > 0 && `📚 단어 ${vocabWins}개 정복`}
              </p>
            )}
            <p style={{marginTop:14, fontSize:"1.05em"}}>
              {pct === 100 ? "🌟 완벽! 변형 문제도 다 맞았어!" :
               pct >= 70 ? "👏 잘했어! 개념 단단해지고 있어." :
               pct >= 40 ? "💪 단계별로 다시 한 번 보면 더 좋아질 거야!" :
               "🌱 천천히 개념 사다리 다시 읽어보자."}
            </p>
            {wrongUnits.length > 0 && (
              <div style={{margin:"16px 0"}}>
                <div style={{fontSize:"0.95em", color:"#666", marginBottom:6}}>다시 볼 단원</div>
                {wrongUnits.map((u,i) => <span key={i} className="focus-tag">{u}</span>)}
              </div>
            )}
            <button className="btn" onClick={() => { setStepIdx(0); setAnswers([]); setDone(false); setStarted(false); }}>다시 보기 🔁</button>
          </div>
        );
      }

      const step = allSteps[stepIdx];
      const isLastStep = nextVisibleIdx(stepIdx) >= allSteps.length;

      // 게임 종료 — 점수는 선시도(찍기) 제외 (P1)
      function finishGame(finalAnswers) {
        const arr = finalAnswers || answers;
        const scored = scoredOf(arr);
        const correct = scored.filter(a => a.correct).length;
        const dur = Math.round((Date.now() - startRef.current)/1000);
        recordResult({
          game: cfg.game, sheet_tab: cfg.sheet_tab, player: name,
          score: correct, total: scored.length, duration_sec: dur,
          answers: arr, meta: { week: meta.week, weakness_focus: meta.weakness_focus, suneung: true },
        });
        setDone(true);
      }

      // Phase 4: 챌린지 시작 step이면 "한 판 더?" 분기 화면 (이 사이클의 첫 챌린지인 경우)
      const isFirstChallengeInCycle = step?.is_challenge && (
        stepIdx === 0 || !allSteps[stepIdx-1]?.is_challenge ||
        (allSteps[stepIdx-1]?.is_challenge && allSteps[stepIdx-1].data?.unit !== step.data?.unit)
      );

      // 챌린지 건너뛰기: 같은 사이클의 모든 챌린지 step 다음으로 점프 (gated 숨김도 함께 skip)
      function skipChallenges() {
        let next = stepIdx + 1;
        while (next < allSteps.length && (
               (allSteps[next].is_challenge && allSteps[next].data?.unit === step.data?.unit) ||
               isStepHidden(allSteps[next]))) {
          next++;
        }
        if (next >= allSteps.length) {
          finishGame();
        } else {
          setStepIdx(next);
          setShowFeedback(false);
          setPicked(null);
          setShortText("");
        }
      }

      function goNext() {
        if (isLastStep) {
          finishGame();
        } else {
          setStepIdx(nextVisibleIdx(stepIdx));
        }
      }

      function resolveAnswer(q) {
        // answer가 "1"~"4" 번호 형식이면 choices[N-1]로 변환 (Codex 출제 흔한 패턴)
        if (q.type === "mcq" && q.choices && /^[1-4]$/.test(String(q.answer).trim())) {
          const idx = parseInt(q.answer) - 1;
          if (q.choices[idx] !== undefined) return q.choices[idx];
        }
        return q.answer;
      }
      function submitQuiz() {
        if (showFeedback) return;
        const q = step.data;
        const isMcq = q.type === "mcq";
        const correctAns = resolveAnswer(q);
        let userAns, isCorrect;
        if (isMcq) {
          userAns = picked;
          isCorrect = picked === correctAns;
        } else {
          userAns = shortText.trim();
          isCorrect = userAns.toLowerCase() === String(correctAns).trim().toLowerCase();
        }
        if (userAns === null || userAns === "") return;
        playSfx(isCorrect ? "ok" : "wrong");
        const newAnswer = { id: q.id, picked: userAns, correct: isCorrect, unit: q.unit, subject: q.subject || step.subject, time: 0, correctAns };
        const newAnswers = [...answers, newAnswer];
        setAnswers(newAnswers);
        setShowFeedback(true);
        // ★ P1: 변형1 결과 → 사다리·해설 gated 결정 (맞히면 건너뜀)
        if (step.is_variant1) {
          setV1Pass(prev => ({ ...prev, [step.cycleIdx]: isCorrect }));
        }
        // Phase 3+4: XP toast — 복수전 +15 / 변형 +10 / 챌린지·단어 +5. 도파민 차별화.
        if (isCorrect) {
          try {
            const toast = document.createElement("div");
            toast.className = "xp-toast";
            if (q.is_revenge) {
              toast.textContent = "+15 XP ⚔️ 복수 성공!";
              toast.style.background = "linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%)";
              toast.style.color = "#fff";
            } else if (q.is_vocab) {
              toast.textContent = "+5 XP 📚";
              toast.style.background = "linear-gradient(135deg, #5ed5a0 0%, #2a9d6f 100%)";
            } else if (q.is_challenge) {
              toast.textContent = "+5 XP ⚡";
              toast.style.background = "linear-gradient(135deg, #b48dff 0%, #7d3ce0 100%)";
            } else {
              toast.textContent = "+10 XP ✨";
            }
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
          } catch (e) {}
        }
        // 🆕 incremental save — 매 풀이 직후 즉시 시트 저장 (점수는 선시도 제외)
        try {
          const scored = scoredOf(newAnswers);
          const dur = Math.round((Date.now() - startRef.current)/1000);
          recordResult({
            game: cfg.game,
            sheet_tab: cfg.sheet_tab,
            player: name,
            score: scored.filter(a => a.correct).length,
            total: scored.length,
            duration_sec: dur,
            answers: newAnswers,
            meta: { week: meta.week, weakness_focus: meta.weakness_focus, suneung: true, is_partial: true, cycle_idx: cycleIdx },
          });
        } catch (e) { console.warn("incremental save failed", e); }
      }

      // 🔮 선시도 (찍어봐) — 진짜 수능 문제에 부담 없는 prediction (점수 무관, P1)
      function submitPrediction(circled) {
        if (showFeedback) return;
        const isCorrect = (step.realAnswer || "").includes(circled);
        setPicked(circled);
        playSfx(isCorrect ? "ok" : "tap");
        setAnswers([...answers, {
          id: `${step.cycleId || "x"}-p`, picked: circled, correct: isCorrect,
          unit: step.unit, subject: step.subject, is_prediction: true, time: 0,
          correctAns: step.realAnswer,
        }]);
        setShowFeedback(true);
      }

      const cycleTotal = problems.length;
      const cycleIdx = step.cycleIdx + 1;
      const sectionLabel = step.cycleIdx >= 0
        ? `사이클 ${cycleIdx} / ${cycleTotal}`
        : step.cycleIdx === -1 ? "⚔️ 복수전"
        : step.cycleIdx === -2 ? "📚 오늘의 단어"
        : step.cycleIdx === -4 ? "📖 이번 주 책"
        : "💬 마무리";

      return (
        <div className="card">
          <div className="step-meta">
            <span>{sectionLabel} · 단계 {stepIdx+1} / {allSteps.length}</span>
            <span>{step.unit && <span className="badge">{step.unit}</span>}</span>
          </div>
          <div className="progress"><div className="progress-bar" style={{width: `${((stepIdx+1)/allSteps.length)*100}%`}}></div></div>

          {step.type === "intro" && (
            <>
              {step.suneung && <div style={{marginBottom:10}}><span className="badge suneung">📌 참고 기출: {step.suneung}</span></div>}
              <div className="step-title">{step.title || "🎯 기출 문제"}</div>
              <div className="step-body">{renderWithEmphasis(step.body, step.emphasize)}</div>
              {/* 🔮 P1 선시도 — 클릭해서 찍어보기 (점수 무관, pretesting) */}
              {step.predict && step.realChoices && step.realChoices.length >= 4 && (
                <div style={{marginTop:18, background:"#faf6ff", padding:14, borderRadius:14}}>
                  <div style={{fontSize:"0.9em", color:"#6b4ba8", fontWeight:700, marginBottom:4}}>
                    🔮 일단 찍어봐! (진짜 수능 그대로)
                  </div>
                  <div style={{fontSize:"0.78em", color:"#999", marginBottom:10}}>
                    맞아도 틀려도 점수에 안 들어가 — 감만 잡아보는 거야.
                  </div>
                  {step.realChoices.map((c, i) => {
                    const circled = ["①","②","③","④","⑤"][i] || `${i+1}.`;
                    const isAns = showFeedback && (step.realAnswer || "").includes(circled);
                    const isMine = showFeedback && picked === circled;
                    return (
                      <button key={i} disabled={showFeedback}
                        onClick={() => submitPrediction(circled)}
                        style={{
                          display:"block", width:"100%", textAlign:"left",
                          padding:"8px 12px", marginBottom:6,
                          background: isAns ? "#d4f5d4" : (isMine ? "#ffd4d4" : "white"),
                          borderRadius:10,
                          border: isAns ? "2px solid #4caf50" : (isMine ? "2px solid #f44336" : "1px solid #e8d5ff"),
                          fontSize:"0.95em", lineHeight:1.6, fontFamily:"inherit",
                          cursor: showFeedback ? "default" : "pointer",
                        }}>
                        <span style={{fontWeight:700, color:"#6b4ba8", marginRight:8}}>{isAns ? "✅ " : ""}{circled}</span>
                        {c}
                      </button>
                    );
                  })}
                  {showFeedback && (
                    <div style={{marginTop:8, padding:"10px 12px", borderRadius:10,
                      background: answers[answers.length-1]?.correct ? "#e8f7e8" : "#fff8e1",
                      fontSize:"0.92em", fontWeight:700,
                      color: answers[answers.length-1]?.correct ? "#2a7a2a" : "#9c6b00"}}>
                      {answers[answers.length-1]?.correct
                        ? "🔮 오! 찍었는데 맞았어! 감각 있는데? 이제 왜 그게 답인지 확인하러 가자."
                        : `괜찮아 — 답은 ${step.realAnswer}. 이제 이걸 푸는 무기를 가지러 가자 ⚒️`}
                    </div>
                  )}
                </div>
              )}
              {/* 선시도 불가(선택지·정답 메타 없음) — 기존 정적 표시 */}
              {!step.predict && step.realChoices && step.realChoices.length >= 4 && (
                <div style={{marginTop:18, background:"#faf6ff", padding:14, borderRadius:14}}>
                  <div style={{fontSize:"0.9em", color:"#6b4ba8", fontWeight:700, marginBottom:10}}>선택지 (진짜 수능 그대로)</div>
                  {step.realChoices.map((c, i) => {
                    const circled = ["①","②","③","④","⑤"][i] || `${i+1}.`;
                    return (
                      <div key={i} style={{
                        padding:"8px 12px",
                        marginBottom:6,
                        background:"white",
                        borderRadius:10,
                        border:"1px solid #e8d5ff",
                        fontSize:"0.95em",
                        lineHeight:1.6,
                      }}>
                        <span style={{fontWeight:700, color:"#6b4ba8", marginRight:8}}>{circled}</span>
                        {c}
                      </div>
                    );
                  })}
                  {step.realAnswer && (
                    <details style={{marginTop:10, fontSize:"0.85em", color:"#888"}}>
                      <summary style={{cursor:"pointer"}}>🔍 진짜 수능 정답 보기 (먼저 풀어본 후!)</summary>
                      <div style={{marginTop:6, padding:"6px 10px", background:"#fff8e1", borderRadius:8}}>
                        정답: <strong style={{color:"#c87800"}}>{step.realAnswer}</strong>
                      </div>
                    </details>
                  )}
                </div>
              )}
              {step.book_diagram_url && (
                <div style={{margin:"16px 0", textAlign:"center"}}>
                  <img src={step.book_diagram_url} alt="책 도해" style={{maxWidth:"100%", borderRadius:14, boxShadow:"0 4px 12px rgba(120,80,200,0.15)"}} />
