<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>농도 실험실</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      padding: 16px;
      background: linear-gradient(135deg, #ffe5f0 0%, #e8d5ff 50%, #d5e6ff 100%);
      color: #2a2a3a;
      font-family: 'Nanum Gothic', sans-serif;
      line-height: 1.55;
    }
    .root {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 22px;
    }
    .card {
      margin-bottom: 14px;
      padding: 26px;
      background: rgba(255,255,255,0.94);
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(120,80,200,0.18);
    }
    .title {
      color: #6b4ba8;
      font-family: 'Gaegu', cursive;
      font-size: clamp(2.05rem, 8vw, 3.2rem);
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }
    .subtitle {
      margin-top: 8px;
      color: #777;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .beaker-card { padding-bottom: 20px; }
    .beaker-wrap {
      position: relative;
      width: min(100%, 420px);
      margin: 0 auto;
      aspect-ratio: 1 / 0.86;
    }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .liquid {
      transition: y 0.3s ease, height 0.3s ease, fill 0.3s ease;
    }
    .salt-dot {
      fill: #fff3a8;
      stroke: #d09a00;
      stroke-width: 0.8;
      filter: drop-shadow(0 1px 1px rgba(80,60,20,0.2));
    }
    .percent-text {
      font-family: 'Gaegu', cursive;
      font-size: 50px;
      font-weight: 700;
      fill: #fff;
      stroke: rgba(70,60,120,0.6);
      stroke-width: 4px;
      paint-order: stroke fill;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .beaker-meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
      color: #6b4ba8;
      font-weight: 800;
    }
    .pill {
      min-height: 34px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #f5edff;
    }
    .control-card {
      display: grid;
      gap: 14px;
    }
    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .control-label {
      color: #6b4ba8;
      font-family: 'Gaegu', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1;
    }
    .value {
      min-width: 86px;
      color: #4d9eff;
      font-family: 'Gaegu', cursive;
      font-size: 2.05rem;
      font-weight: 700;
      line-height: 1;
      text-align: right;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      gap: 10px;
      align-items: center;
    }
    button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff8fc5, #b48dff);
      color: white;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(180,141,255,0.28);
    }
    button:active { transform: translateY(1px); }
    input[type="range"] {
      width: 100%;
      min-height: 44px;
      accent-color: #b48dff;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 13px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff8fc5, #b48dff, #4d9eff);
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 30px;
      height: 30px;
      margin-top: -8.5px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #6b4ba8;
      box-shadow: 0 3px 9px rgba(70,40,120,0.35);
      appearance: none;
    }
    input[type="range"]::-moz-range-track {
      height: 13px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff8fc5, #b48dff, #4d9eff);
    }
    input[type="range"]::-moz-range-thumb {
      width: 30px;
      height: 30px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #6b4ba8;
      box-shadow: 0 3px 9px rgba(70,40,120,0.35);
    }
    .formula {
      display: grid;
      gap: 8px;
      font-size: clamp(1rem, 4.5vw, 1.32rem);
      font-weight: 800;
    }
    .formula-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .formula-main {
      color: #6b4ba8;
      font-family: 'Gaegu', cursive;
      font-size: 2rem;
      font-weight: 700;
    }
    .denom {
      position: relative;
      display: inline-block;
      color: #6b4ba8;
      font-weight: 900;
    }
    .denom-label {
      display: block;
      width: fit-content;
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #f0e8ff;
      color: #6b4ba8;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .missions {
      display: grid;
      gap: 10px;
    }
    .mission {
      position: relative;
      padding: 15px 16px 15px 44px;
      border: 2px solid #eadfff;
      border-radius: 18px;
      background: #fff;
      color: #555;
      font-weight: 800;
      transition: opacity 0.2s, transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .mission::before {
      position: absolute;
      left: 15px;
      top: 15px;
      content: attr(data-mark);
    }
    .mission.current {
      border-color: #b48dff;
      background: linear-gradient(135deg, #fff0f7 0%, #f4efff 100%);
      color: #2a2a3a;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(180,141,255,0.16);
    }
    .mission.done {
      opacity: 0.55;
      background: #f7f7f7;
    }
    .footer-note {
      color: #888;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: center;
    }
    .toast {
      position: fixed;
      top: 30%;
      left: 50%;
      z-index: 9999;
      max-width: min(88vw, 470px);
      padding: 16px 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, #b48dff 0%, #4d9eff 100%);
      color: white;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 8px 24px rgba(120,80,200,0.35);
      pointer-events: none;
      animation: xp-popup 2s ease-out forwards;
    }
    .toast.gold {
      background: linear-gradient(135deg, #ffd700 0%, #ffaa3a 100%);
      color: #4a2d00;
      font-size: 1.6rem;
      box-shadow: 0 8px 24px rgba(255,170,58,0.5);
    }
    @keyframes xp-popup {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -30px) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -80px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(0.9); opacity: 0; }
    }
    @media (max-width: 520px) {
      body { padding: 10px; }
      .card { padding: 18px; border-radius: 22px; }
      .control-label { font-size: 1.55rem; }
      .value { min-width: 72px; font-size: 1.75rem; }
      .slider-row { grid-template-columns: 46px 1fr 46px; gap: 8px; }
      .percent-text { font-size: 43px; }
    }
  </style>
</head>
<body>
  <main class="root">
    <section class="card">
      <h1 class="title">🧪 농도 실험실</h1>
      <p class="subtitle">물과 소금을 직접 움직여봐!</p>
    </section>

    <section class="card beaker-card" aria-label="비커 시각화">
      <div class="beaker-wrap">
        <svg viewBox="0 0 360 310" role="img" aria-labelledby="beakerTitle beakerDesc">
          <title id="beakerTitle">농도 비커</title>
          <desc id="beakerDesc">소금물 전체 양은 높이, 농도는 색 진하기로 보입니다.</desc>
          <defs>
            <clipPath id="liquidClip">
              <path d="M88 48 L272 48 L252 285 Q250 298 236 298 L124 298 Q110 298 108 285 Z" />
            </clipPath>
            <linearGradient id="glass" x1="0" x2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.25" />
              <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.28" />
            </linearGradient>
          </defs>
          <path d="M86 48 L274 48" fill="none" stroke="#6b4ba8" stroke-width="9" stroke-linecap="round" />
          <path d="M90 48 L270 48 L251 286 Q249 300 235 300 L125 300 Q111 300 109 286 Z" fill="rgba(255,255,255,0.34)" stroke="#6b4ba8" stroke-width="6" stroke-linejoin="round" />
          <g clip-path="url(#liquidClip)">
            <rect id="liquid" class="liquid" x="70" y="245" width="220" height="40" rx="10" fill="hsl(205, 72%, 78%)" />
            <ellipse id="surface" cx="180" cy="245" rx="94" ry="13" fill="rgba(255,255,255,0.3)" />
            <g id="saltDots"></g>
          </g>
          <path d="M90 48 L270 48 L251 286 Q249 300 235 300 L125 300 Q111 300 109 286 Z" fill="url(#glass)" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
          <g opacity="0.22" stroke="#6b4ba8" stroke-width="2">
            <path d="M105 105 H132" />
            <path d="M101 158 H128" />
            <path d="M97 211 H124" />
            <path d="M93 264 H120" />
          </g>
          <text id="percentText" class="percent-text" x="180" y="172">20.0%</text>
        </svg>
      </div>
      <div class="beaker-meta">
        <span class="pill" id="totalLabel">전체 100g</span>
        <span class="pill" id="dotLabel">소금 알갱이 4개</span>
      </div>
    </section>

    <section class="card control-card" aria-label="소금 조절">
      <div class="control-head">
        <label class="control-label" for="saltRange">🧂 소금</label>
        <output class="value" id="saltValue" for="saltRange">20g</output>
      </div>
      <div class="slider-row">
        <button type="button" data-target="salt" data-step="-10" aria-label="소금 10g 줄이기">−10</button>
        <input id="saltRange" type="range" min="0" max="100" step="1" value="20" />
        <button type="button" data-target="salt" data-step="10" aria-label="소금 10g 늘리기">+10</button>
      </div>
    </section>

    <section class="card control-card" aria-label="물 조절">
      <div class="control-head">
        <label class="control-label" for="waterRange">💧 물</label>
        <output class="value" id="waterValue" for="waterRange">80g</output>
      </div>
      <div class="slider-row">
        <button type="button" data-target="water" data-step="-10" aria-label="물 10g 줄이기">−10</button>
        <input id="waterRange" type="range" min="0" max="400" step="1" value="80" />
        <button type="button" data-target="water" data-step="10" aria-label="물 10g 늘리기">+10</button>
      </div>
    </section>

    <section class="card formula" aria-label="농도 공식">
      <div class="formula-main">농도(%) = 소금 ÷ 소금물 전체 × 100</div>
      <div class="formula-line">
        <span>=</span>
        <span id="formulaSalt">20g</span>
        <span>÷</span>
        <span class="denom" id="formulaDenom">(20+80)g</span>
        <span>× 100 =</span>
        <span id="formulaResult">20.0%</span>
      </div>
      <span class="denom-label">기준량은 소금물 전체! (물만이 아니야)</span>
    </section>

    <section class="card">
      <div class="missions" aria-label="도전 미션">
        <div class="mission current" id="mission0" data-mark="1.">소금 20g, 물 80g을 맞춰봐. 농도가 몇 %가 되지?</div>
        <div class="mission" id="mission1" data-mark="2.">소금은 그대로 두고, 물만 부어서 농도를 10%로 만들어봐</div>
        <div class="mission" id="mission2" data-mark="3.">이번엔 물을 증발시켜서(줄여서) 농도를 다시 20%로!</div>
      </div>
    </section>

    <p class="footer-note">농도가 변한 건 소금이 변해서가 아니라, 전체 양이 변했기 때문이야.</p>
  </main>

  <script>
    (() => {
      const saltRange = document.getElementById('saltRange');
      const waterRange = document.getElementById('waterRange');
      const saltValue = document.getElementById('saltValue');
      const waterValue = document.getElementById('waterValue');
      const liquid = document.getElementById('liquid');
      const surface = document.getElementById('surface');
      const saltDots = document.getElementById('saltDots');
      const percentText = document.getElementById('percentText');
      const totalLabel = document.getElementById('totalLabel');
      const dotLabel = document.getElementById('dotLabel');
      const formulaSalt = document.getElementById('formulaSalt');
      const formulaDenom = document.getElementById('formulaDenom');
      const formulaResult = document.getElementById('formulaResult');
      const missions = [0, 1, 2].map((i) => document.getElementById(`mission${i}`));
      const done = [false, false, false];
      const missionMessages = [
        '✅ 맞았어! 농도는 20.0%',
        '✅ 물이 2배로 늘면 농도는 절반! 소금은 그대로인데!',
        '✅ 다시 20%! 전체 양이 줄어서 농도가 올라갔어!'
      ];
      const dotPositions = [
        [128,270],[174,264],[218,272],[151,238],[196,232],
        [235,242],[117,217],[166,207],[211,214],[247,202],
        [134,186],[185,176],[229,183],[112,158],[158,149],
        [205,154],[246,143],[133,122],[184,112],[230,119]
      ];
      let masterShown = false;

      function concentration(salt, water) {
        const total = salt + water;
        return total === 0 ? 0 : (salt / total) * 100;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function liquidColor(percent) {
        const t = clamp(percent / 30, 0, 1);
        const hue = 205 + (214 - 205) * t;
        const sat = 68 + (88 - 68) * t;
        const light = 86 + (42 - 86) * t;
        return `hsl(${hue}, ${sat}%, ${light}%)`;
      }

      function showToast(text, gold = false) {
        const toast = document.createElement('div');
        toast.className = `toast${gold ? ' gold' : ''}`;
        toast.textContent = text;
        document.body.appendChild(toast);
        window.setTimeout(() => toast.remove(), 2100);
      }

      function renderDots(count, topY) {
        saltDots.replaceChildren();
        dotPositions.slice(0, count).forEach(([x, y], index) => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          const adjustedY = Math.max(topY + 12, y);
          dot.setAttribute('class', 'salt-dot');
          dot.setAttribute('cx', x);
          dot.setAttribute('cy', adjustedY);
          dot.setAttribute('r', String(index % 3 === 0 ? 4.8 : 4.1));
          saltDots.appendChild(dot);
        });
      }

      function setMissionClasses() {
        const current = done.findIndex((value) => !value);
        missions.forEach((mission, index) => {
          mission.classList.toggle('done', done[index]);
          mission.classList.toggle('current', index === current);
          mission.dataset.mark = done[index] ? '✅' : `${index + 1}.`;
        });
      }

      function checkMissions(salt, water, percent) {
        if (!done[0] && Math.abs(salt - 20) <= 1 && Math.abs(water - 80) <= 2) {
          done[0] = true;
          showToast(missionMessages[0]);
        } else if (done[0] && !done[1] && Math.abs(salt - 20) <= 1 && Math.abs(percent - 10) <= 0.5) {
          done[1] = true;
          showToast(missionMessages[1]);
        } else if (done[0] && done[1] && !done[2] && Math.abs(salt - 20) <= 1 && Math.abs(percent - 20) <= 0.5) {
          done[2] = true;
          showToast(missionMessages[2]);
        }
        setMissionClasses();
        if (done.every(Boolean) && !masterShown) {
          masterShown = true;
          window.setTimeout(() => showToast('🏆 농도 마스터!', true), 260);
        }
      }

      function update() {
        const salt = Number(saltRange.value);
        const water = Number(waterRange.value);
        const total = salt + water;
        const percent = concentration(salt, water);
        const percentDisplay = `${percent.toFixed(1)}%`;
        const fillHeight = clamp((total / 500) * 237, 0, 237);
        const liquidY = 285 - fillHeight;
        const dotCount = clamp(Math.floor(salt / 5), 0, 20);

        saltValue.textContent = `${salt}g`;
        waterValue.textContent = `${water}g`;
        percentText.textContent = percentDisplay;
        totalLabel.textContent = `전체 ${total}g`;
        dotLabel.textContent = `소금 알갱이 ${dotCount}개`;
        formulaSalt.textContent = `${salt}g`;
        formulaDenom.textContent = `(${salt}+${water})g`;
        formulaResult.textContent = percentDisplay;

        liquid.setAttribute('y', liquidY);
        liquid.setAttribute('height', fillHeight);
        liquid.setAttribute('fill', liquidColor(percent));
        surface.setAttribute('cy', liquidY);
        surface.setAttribute('opacity', total === 0 ? '0' : '1');
        renderDots(dotCount, liquidY);
        checkMissions(salt, water, percent);
      }

      function stepValue(target, step) {
        const input = target === 'salt' ? saltRange : waterRange;
        input.value = String(clamp(Number(input.value) + step, Number(input.min), Number(input.max)));
        update();
      }

      document.querySelectorAll('button[data-target]').forEach((button) => {
        button.addEventListener('click', () => stepValue(button.dataset.target, Number(button.dataset.step)));
      });
      saltRange.addEventListener('input', update);
      waterRange.addEventListener('input', update);
      update();
    })();
  </script>
</body>
</html>
